<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-accent="graphite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班级班费公示</title>
<meta name="theme-color" content="#eeeef1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="班级班费收支与班级公告公开公示，班委凭密码维护。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8e8eb'/%3E%3Cpath d='M9 9h9l5 5v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2z' fill='%232f2f38'/%3E%3C/svg%3E">
</head>
<body>

<!-- ============ 框架样式（StudyLens，原封不动） ============ -->
<style>
:root{
  /* 黑白灰梯度主题（v2.6.2）：整套配色只用中性灰阶。
     品牌色 = 近黑（深色主题下反过来 = 近白）；层级靠「灰阶深浅 + 实心/描边」区分，不靠色相。 */
  --bg:#eeeef1; --panel:#f8f8fa; --panel2:#e9e9ed; --panel3:#f3f3f6;
  --text:#4a4a52; --muted:#6d6d76; --line:#e2e2e6; --line2:#cdcdd3;
  --primary:#4a4a52; --primary2:#3a3a42; --primary-soft:#e8e8eb;
  --btn-solid:#55555f; --btn-solid-hover:#45454e; --btn-fg:#ffffff;
  --accent:#62626c; --accent-soft:#e8e8eb;
  --warn:#62626c; --warn-soft:#eaeaed;
  /* v2.7.2（需求 9）：危险操作与退出登录标红（此前跟着灰阶主题做成了灰） */
  --danger:#bf2f22; --danger-soft:#fdecea;
  /* 需求：学习卡片的「不记得/记得」保留红与绿（语义色，不随主题色走） */
  --no:#b3261e; --no-soft:#fdecea;
  --yes:#1c7a4b; --yes-soft:#e7f5ed;
  --radius:18px; --radius-sm:11px; --radius-lg:24px;
  --shadow:0 0 0 1px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.05), 0 22px 46px -22px rgba(0,0,0,.20);
  --shadow-sm:0 0 0 1px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.04), 0 8px 22px -14px rgba(0,0,0,.16);
  --sidebar-w:248px;
  color-scheme:light;
}

[data-theme="dark"]{
  --bg:#1b1b21; --panel:#232329; --panel2:#2b2b32; --panel3:#1f1f25;
  --text:#cdcdd3; --muted:#9c9ca5; --line:#34343d; --line2:#4e4e59;
  --primary:#cdcdd3; --primary2:#dedee4; --primary-soft:#2d2d35;
  --btn-solid:#c9c9d0; --btn-solid-hover:#d8d8de; --btn-fg:#22222a;
  --accent:#b4b4bd; --accent-soft:#292930;
  --warn:#b4b4bd; --warn-soft:#2b2b33;
  --danger:#f0918a; --danger-soft:#3a2222;
  --no:#f0918a; --no-soft:#3a2222;
  --yes:#7fd3a4; --yes-soft:#16311f;
  --shadow:0 0 0 1px rgba(255,255,255,.05), 0 2px 6px rgba(0,0,0,.30), 0 24px 48px -22px rgba(0,0,0,.6);
  --shadow-sm:0 0 0 1px rgba(255,255,255,.04), 0 1px 2px rgba(0,0,0,.28), 0 10px 26px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}


/* ===== 主题色（v2.7.0，需求「设置一个主题颜色，有限度地在应用中使用」）=====
   只覆盖强调色相关 token；底色/面板/文字/描边恒为中性灰。graphite = 默认中性色，无需规则。*/
html[data-accent="indigo"] {--primary:#4a54c8; --primary2:#3b45ad; --primary-soft:#e9eafb; --btn-solid:#4f5ad0; --btn-solid-hover:#414bb8; --btn-fg:#ffffff; --accent:#5b64d6; --accent-soft:#e9eafb;}

html[data-accent="blue"] {--primary:#2563c9; --primary2:#1d51a8; --primary-soft:#e6eefb; --btn-solid:#2a6ad4; --btn-solid-hover:#2159b6; --btn-fg:#ffffff; --accent:#2f6fd8; --accent-soft:#e6eefb;}

html[data-accent="green"] {--primary:#1f7a52; --primary2:#186444; --primary-soft:#e4f3ec; --btn-solid:#22855a; --btn-solid-hover:#1b6e49; --btn-fg:#ffffff; --accent:#27795a; --accent-soft:#e4f3ec;}

html[data-accent="amber"] {--primary:#8f5410; --primary2:#7a4710; --primary-soft:#faf0e0; --btn-solid:#9a5c14; --btn-solid-hover:#834d10; --btn-fg:#ffffff; --accent:#96601a; --accent-soft:#faf0e0;}

html[data-accent="rose"] {--primary:#ab3d61; --primary2:#913253; --primary-soft:#fbe9ef; --btn-solid:#b8476c; --btn-solid-hover:#9d3c5c; --btn-fg:#ffffff; --accent:#b0456a; --accent-soft:#fbe9ef;}

html[data-accent="violet"] {--primary:#7a4bc0; --primary2:#663fa3; --primary-soft:#f0eafb; --btn-solid:#8253c9; --btn-solid-hover:#6f46ac; --btn-fg:#ffffff; --accent:#8153c4; --accent-soft:#f0eafb;}

html[data-theme="dark"][data-accent="indigo"] {--primary:#a8b0f4; --primary2:#c2c8fa; --primary-soft:#2a2c44; --btn-solid:#8e97ec; --btn-solid-hover:#a2aaf3; --btn-fg:#191a2c; --accent:#a2aaf3; --accent-soft:#2a2c44;}

html[data-theme="dark"][data-accent="blue"] {--primary:#8fb9f5; --primary2:#aacdfa; --primary-soft:#1f2c3d; --btn-solid:#7aa9ee; --btn-solid-hover:#96bdf5; --btn-fg:#101a28; --accent:#96bdf5; --accent-soft:#1f2c3d;}

html[data-theme="dark"][data-accent="green"] {--primary:#79cfa4; --primary2:#9bdcbb; --primary-soft:#17301f; --btn-solid:#6cc396; --btn-solid-hover:#85d3ab; --btn-fg:#0d1f14; --accent:#85d3ab; --accent-soft:#17301f;}

html[data-theme="dark"][data-accent="amber"] {--primary:#e6b366; --primary2:#f0c98c; --primary-soft:#382a16; --btn-solid:#dcab5e; --btn-solid-hover:#e8ba75; --btn-fg:#2a1e0d; --accent:#e8ba75; --accent-soft:#382a16;}

html[data-theme="dark"][data-accent="rose"] {--primary:#f09cb6; --primary2:#f5b8cb; --primary-soft:#3c2230; --btn-solid:#e690ac; --btn-solid-hover:#f2a6be; --btn-fg:#2d1620; --accent:#f2a6be; --accent-soft:#3c2230;}

html[data-theme="dark"][data-accent="violet"] {--primary:#bda0ec; --primary2:#cfb8f4; --primary-soft:#302544; --btn-solid:#b195e6; --btn-solid-hover:#c3acef; --btn-fg:#221737; --accent:#c3acef; --accent-soft:#302544;}


/* ===== 头像裁剪（v2.7.0）===== */
.avc-mask{position:fixed; inset:0; z-index:1150; background:rgba(14,14,18,.72);
  -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); display:flex; align-items:center; justify-content:center;
  padding:20px; animation:avcIn .16s var(--ease)}

@keyframes avcIn{from{opacity:0} to{opacity:1}}

.avc-card{width:100%; max-width:398px; background:var(--panel); border-radius:22px; box-shadow:var(--shadow);
  padding:17px 17px 13px; display:flex; flex-direction:column; gap:11px}

.avc-title{font-size:15px; font-weight:750; display:flex; align-items:center; gap:8px}

.avc-title .ico{display:flex; color:var(--primary)}

.avc-stage{position:relative; width:100%; aspect-ratio:1 / 1; overflow:hidden; border-radius:16px; background:#0f0f13;
  touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}

.avc-stage.drag{cursor:grabbing}

.avc-stage img{position:absolute; left:50%; top:50%; max-width:none; transform-origin:center center;
  pointer-events:none; -webkit-user-drag:none; user-drag:none}

.avc-ring{position:absolute; left:50%; top:50%; border-radius:50%; pointer-events:none;
  box-shadow:0 0 0 9999px rgba(0,0,0,.55); border:1.5px solid rgba(255,255,255,.9)}

.avc-hint{font-size:12.5px; color:var(--muted); text-align:center; margin-top:-2px}

.avc-zoom{display:flex; align-items:center; gap:10px}

.avc-zoom .ico{display:flex; color:var(--muted); flex:none}

.avc-zoom input[type=range]{flex:1; min-width:0}

.avc-zoom b{font-size:12px; color:var(--muted); min-width:40px; text-align:right; font-variant-numeric:tabular-nums}

.avc-acts{display:flex; gap:10px; justify-content:flex-end; margin-top:1px}


/* 主题色选择器：色板圆点用 currentColor 同时决定填充与选中环 */
.acc-row{display:flex; align-items:center; gap:9px; flex-wrap:wrap}

.acc-sw{width:25px; height:25px; padding:0; border-radius:50%; border:1px solid var(--line2); background:transparent;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease)}

.acc-sw i{display:block; width:15px; height:15px; border-radius:50%; background:currentColor}

.acc-sw:hover{transform:scale(1.1); border-color:currentColor}

.acc-sw:active{transform:scale(.95)}

.acc-sw.on{border-color:currentColor; box-shadow:0 0 0 2px var(--panel), 0 0 0 3.5px currentColor}

.acc-name{font-size:12.5px; color:var(--muted); min-width:54px}

.acc-sw[data-accent="graphite"]{color:#4a4a52}
 .acc-sw[data-accent="indigo"]{color:#4a54c8}

.acc-sw[data-accent="blue"]{color:#2563c9}
 .acc-sw[data-accent="green"]{color:#1f7a52}

.acc-sw[data-accent="amber"]{color:#8f5410}
 .acc-sw[data-accent="rose"]{color:#ab3d61}

.acc-sw[data-accent="violet"]{color:#7a4bc0}

[data-theme="dark"] .acc-sw[data-accent="graphite"]{color:#cdcdd3}

[data-theme="dark"] .acc-sw[data-accent="indigo"]{color:#a8b0f4}

[data-theme="dark"] .acc-sw[data-accent="blue"]{color:#8fb9f5}

[data-theme="dark"] .acc-sw[data-accent="green"]{color:#79cfa4}

[data-theme="dark"] .acc-sw[data-accent="amber"]{color:#e6b366}

[data-theme="dark"] .acc-sw[data-accent="rose"]{color:#f09cb6}

[data-theme="dark"] .acc-sw[data-accent="violet"]{color:#bda0ec}


*{box-sizing:border-box; margin:0; padding:0}

html{scroll-behavior:smooth; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale}

body{font-family:"Plus Jakarta Sans Variable","Plus Jakarta Sans","Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif; background:var(--bg); color:var(--text); font-size:15px; line-height:1.62; overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  transition:background-color .22s var(--ease), color .22s var(--ease)}

/* v2.7.7：主题/主题色切换时承载面一起淡变（只覆盖承载面，不做全站 * 过渡，避免掉帧） */
.card,.en-hero,.sidebar,.flashcard,.page,.stat,.modal,.sheet,.flow-band,.topbar,.study-meta,.rv-row,.lib-row,.kv{
  transition-property:background-color,border-color,color,box-shadow;
  transition-duration:.2s; transition-timing-function:var(--ease)}

.skip-link{position:fixed; left:14px; top:-60px; z-index:1000; background:var(--primary); color:var(--btn-fg); padding:9px 16px; border-radius:11px; font-weight:700; font-size:14px; box-shadow:var(--shadow); transition:top .18s ease-out; text-decoration:none}

.skip-link:focus{top:14px; color:var(--btn-fg); text-decoration:none}

/* 移动端禁用双击缩放与 300ms 点击延迟（保留双指缩放） */
html,body,button,input,select,textarea,a,label,.btn,.nav-btn,.bnav-btn,.book-opt,.lib-row,.flashcard,.pager button,[onclick]{touch-action:manipulation}

button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}

input,select,textarea{font-family:inherit; font-size:14px; color:var(--text); background:var(--panel); border:1px solid var(--line2); border-radius:var(--radius-sm); padding:9px 12px; outline:none; transition:border-color .15s ease-out, box-shadow .15s ease-out, background-color .15s ease-out}

input:hover,select:hover,textarea:hover{border-color:var(--line2)}

[data-theme="dark"] input:hover,[data-theme="dark"] select:hover,[data-theme="dark"] textarea:hover{border-color:var(--line2)}

input:focus,select:focus,textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft)}

input::placeholder{color:var(--muted); opacity:.75}

a{color:var(--primary); text-decoration:none}

a:hover{text-decoration:underline; text-underline-offset:3px}

[hidden]{display:none !important}

::selection{background:var(--primary-soft)}

:focus-visible{outline:2px solid var(--primary); outline-offset:2px}

::-webkit-scrollbar{width:10px; height:10px}

::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px; border:2px solid transparent; background-clip:content-box}

::-webkit-scrollbar-track{background:transparent}

.num{font-variant-numeric:tabular-nums}

h1,h2,h3,h4{text-wrap:balance; line-height:1.3}

p,li,td,th{text-wrap:pretty}


/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 17px; border-radius:12px; font-size:14px; font-weight:600; background:var(--panel); color:var(--text); border:1px solid var(--line2); transition-property:background-color,color,border-color,box-shadow,scale; transition-duration:150ms; transition-timing-function:ease-out; user-select:none; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.03)}

.btn:hover{border-color:var(--primary); color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft)}

.btn:active{scale:.96}

.btn-primary{background:var(--btn-solid); color:var(--btn-fg); border:1px solid transparent; box-shadow:0 8px 18px -10px rgba(0,0,0,.45)}

.btn-primary:hover{background:var(--btn-solid-hover); color:var(--btn-fg); box-shadow:0 10px 22px -10px rgba(0,0,0,.5)}

.btn-primary:active{opacity:.92}

.btn-accent{background:var(--accent); color:var(--btn-fg); border:1px solid transparent; box-shadow:0 8px 18px -10px rgba(0,0,0,.35)}

.btn-accent:hover{color:var(--btn-fg); opacity:.92}

.btn-danger{background:var(--danger-soft); color:var(--danger);
  border:1px solid color-mix(in srgb, var(--danger) 32%, transparent)}

.btn-danger:hover{background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger);
  border-color:color-mix(in srgb, var(--danger) 55%, transparent); box-shadow:0 0 0 3px color-mix(in srgb, var(--danger) 14%, transparent)}

.btn-danger:active{background:var(--danger); color:#fff; border-color:var(--danger)}

.btn-ghost{background:transparent; border-color:transparent; color:var(--muted); box-shadow:none}

.btn-ghost:hover{color:var(--primary); background:var(--primary-soft)}

.btn-sm{padding:6px 13px; font-size:13px; border-radius:10px}

.btn-lg{padding:12px 24px; font-size:15px; border-radius:14px}

.btn[disabled]{opacity:.5; cursor:not-allowed; scale:1 !important}

.btn .ico-svg{width:15px; height:15px}


/* surfaces */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:22px}

.card + .card{margin-top:18px}

.card-title{font-size:15.5px; font-weight:750; letter-spacing:-.01em; margin-bottom:14px; display:flex; align-items:center; gap:9px}

.card-title .dot{width:8px; height:8px; border-radius:3px; background:var(--primary); display:inline-block}

.muted{color:var(--muted); font-size:13px}

.small{font-size:12.5px}

.tag{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; background:var(--panel2); color:var(--muted); border:1px solid var(--line2);
  white-space:nowrap; word-break:keep-all}
   /* 状态/词库等标签永不逐字竖排 */
.tag-blue{background:var(--primary-soft); color:var(--primary); border-color:transparent}

.tag-green{background:var(--accent-soft); color:var(--accent); border-color:transparent}

.tag-orange{background:var(--warn-soft); color:var(--warn); border-color:transparent}

.tag-red{background:var(--danger-soft); color:var(--danger); border-color:transparent}


/* page header */
.topbar{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:22px; flex-wrap:wrap}

.topbar h1{font-size:25px; font-weight:780; letter-spacing:-.02em; overflow-wrap:anywhere}

.topbar .sub{color:var(--muted); font-size:13px; margin-top:3px}

.grid{display:grid; gap:18px}

.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}

.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}

.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1080px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}


/* stat cards */
.stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:15px; transition-property:box-shadow,border-color,scale; transition-duration:160ms; transition-timing-function:ease-out}

.stat:hover{border-color:var(--line2); box-shadow:var(--shadow)}

.stat-body{display:flex; flex-direction:column; gap:2px; min-width:0}

.stat .k{font-size:12.5px; color:var(--muted); font-weight:650; letter-spacing:.01em}

.stat .v{font-size:25px; font-weight:800; line-height:1.2; letter-spacing:-.02em; font-variant-numeric:tabular-nums}

.stat .v small{font-size:14px; font-weight:650; color:var(--muted)}

.stat .d{font-size:12px; color:var(--muted)}

.stat-ico{width:44px; height:44px; border-radius:13px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0}

.stat-ico .ico-svg{width:22px; height:22px}

.stat-blue{background:var(--primary-soft); color:var(--primary)}

.stat-green{background:var(--accent-soft); color:var(--accent)}

.stat-orange{background:var(--warn-soft); color:var(--warn)}

.stat-red{background:var(--danger-soft); color:var(--danger)}


/* progress */
.bar{height:8px; border-radius:99px; background:var(--panel2); overflow:hidden}

.bar > i{display:block; height:100%; border-radius:99px; background:var(--primary); transition:width .4s cubic-bezier(.2,0,0,1)}

.ico-svg{display:inline-block; vertical-align:-.16em; flex-shrink:0}

.nav-btn .ico{width:18px; height:18px; color:var(--muted); transition:color .15s ease-out}

.nav-btn.active .ico{color:var(--primary)}

.toast i .ico-svg{width:16px; height:16px}

.btn .ico-svg,.banner .ico-svg,.tabs button .ico-svg{vertical-align:-2px}

.empty .big .ico-svg,.study-done .big .ico-svg{width:46px; height:46px; color:var(--accent)}


/* tabs */
.tabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:20px; background:var(--panel2); padding:5px; border-radius:14px; border:1px solid var(--line)}

.tabs button{padding:9px 18px; border-radius:10px; font-size:14px; font-weight:650; color:var(--muted); transition-property:background-color,color,box-shadow; transition-duration:160ms; transition-timing-function:ease-out; display:inline-flex; align-items:center; gap:6px}

.tabs button:hover{color:var(--text)}

.tabs button.active{background:var(--panel); color:var(--primary); box-shadow:0 0 0 1px var(--line2), 0 4px 12px -6px rgba(0,0,0,.18)}


/* auth */
.auth-wrap{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; background:radial-gradient(1100px 560px at 12% -12%, var(--amb-a), transparent 62%), radial-gradient(900px 520px at 108% 112%, var(--amb-b), transparent 60%), var(--bg)}

.auth-card{width:100%; max-width:430px; background:var(--panel); border:1px solid var(--line); border-radius:26px; box-shadow:var(--shadow); padding:38px 34px 30px; position:relative; overflow:hidden}

.auth-card::before{content:""; position:absolute; top:0; left:0; right:0; height:5px; background:var(--primary)}

.auth-brand{display:flex; align-items:center; justify-content:center; gap:10px; font-size:24px; font-weight:800; letter-spacing:.24em; color:var(--text); margin-left:.24em}

.auth-brand::before{content:""; width:26px; height:26px; border-radius:9px; background:var(--primary); box-shadow:0 6px 14px -8px rgba(0,0,0,.45); margin-right:4px; margin-left:.24em}

.auth-tagline{text-align:center; color:var(--muted); font-size:11.5px; letter-spacing:.22em; margin-top:6px; margin-bottom:20px}

.auth-card .lead{color:var(--muted); font-size:13.5px; margin-bottom:24px; text-align:center; line-height:1.75; text-wrap:pretty}

.field{margin-bottom:15px}

.field label{display:block; font-size:13px; font-weight:650; margin-bottom:7px; color:var(--muted)}

.field input{width:100%; min-height:44px; font-size:15px}

.auth-err{background:var(--danger-soft); color:var(--danger); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:14px; display:none}

.auth-switch{margin-top:18px; text-align:center; font-size:13.5px; color:var(--muted)}

.auth-switch button{color:var(--primary); font-weight:750}

.guest-row{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:15px; font-size:13px; color:var(--muted)}

.feature-hint{display:flex; gap:8px; align-items:center; margin-top:20px; padding:12px 14px; background:var(--panel2); border-radius:13px; font-size:12.5px; color:var(--muted)}


/* shell */
/* --vpu 由 JS 按运行时 CSS zoom 折算（zoom 会连 100dvh 一起放大，直接用 100dvh 会溢出整屏） */
.shell{display:flex; min-height:var(--vpu,100dvh)}

/* 侧栏（v2.6.2）：参考 ChatGPT 的可折叠样式。
   左上角只有一个三条杠按钮：点开/收起；收起后宽度归零、边框与内边距一并去掉，
   不留任何边。状态记在 html.side-collapsed 上（解析期就能定，避免开页闪一下）。 */
/* v2.7.2（需求 1）：折叠/展开走同一条缓动曲线，侧栏宽度、内边距、内容一起动，不再瞬移 */
.sidebar{width:var(--sidebar-w); flex-shrink:0; background:var(--panel); border-right:1px solid var(--line);
  padding:64px 14px 16px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0;
  height:var(--vpu,100dvh); overflow-y:auto; overflow-x:hidden;
  transition:width .3s var(--ease-side), padding .3s var(--ease-side), border-right-color .3s var(--ease-side)}

html.side-collapsed .sidebar{width:0; padding:0; border-right-width:0; overflow:hidden; pointer-events:none; visibility:hidden;
  transition:width .3s var(--ease-side), padding .3s var(--ease-side), border-right-width .3s var(--ease-side),
             visibility 0s linear .3s}

/* 收起时侧栏内容先淡出并轻微左移，避免文字被硬生生裁掉。
   用 html .sidebar>* 提一级特异性，压过 .nav-btn / .side-user 各自的 transition 声明 */
html .sidebar>*{transition:opacity .17s var(--ease), transform .3s var(--ease-side),
  background-color .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease)}

html.side-collapsed .sidebar>*{opacity:0; transform:translateX(-12px)}

/* 收起后主区左移，给按钮让出位置（否则按钮会压住页面标题）。
   净效果：内容可用宽度反而更大（视口-64px > 视口-248px-34px）。 */
html.side-collapsed .main{padding-left:64px}

.side-toggle{position:fixed; left:18px; top:12px; z-index:900; width:40px; height:40px; padding:0;
  display:flex; align-items:center; justify-content:center; border-radius:11px;
  background:transparent; border:1px solid transparent; color:var(--muted); cursor:pointer;
  transition:left .3s var(--ease-side), background .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease)}

.side-toggle:hover{background:var(--panel2); color:var(--text); border-color:var(--line)}

/* 折叠后按钮落在主区左上角，回到 12px 更贴边（展开时与导航图标的光学中心对齐） */
html.side-collapsed .side-toggle{left:12px}

.side-toggle:active{transform:scale(.96)}

.side-toggle:focus-visible{outline:2px solid var(--primary); outline-offset:2px}

.nav-btn{display:flex; align-items:center; gap:12px; padding:10px 13px; border-radius:12px; font-size:14px; font-weight:650; color:var(--muted); transition-property:background-color,color; transition-duration:140ms; transition-timing-function:ease-out; text-align:left; width:100%}

.nav-btn .ico{width:21px; display:flex; align-items:center; justify-content:center}

.nav-btn .ico .ico-svg{width:19px; height:19px}

.side-toggle .ico .ico-svg{width:20px; height:20px}

.side-user .su-chev .ico-svg{width:15px; height:15px}

.nav-btn:hover{background:var(--panel2); color:var(--text)}

.nav-btn.active{background:var(--primary-soft); color:var(--primary); font-weight:700}

.nav-sep{height:1px; background:var(--line); margin:12px 8px}

.side-foot{margin-top:auto; padding:10px 8px 4px; font-size:12px; color:var(--muted); line-height:1.6; font-variant-numeric:tabular-nums}

.side-user{display:flex; align-items:center; gap:10px; padding:10px; border-radius:13px; background:var(--panel2); margin-top:10px; border:1px solid var(--line); width:100%; text-align:left; color:inherit; cursor:pointer; transition:background .16s var(--ease), border-color .16s var(--ease)}

.side-user:hover{background:var(--panel3); border-color:var(--line2)}

.side-user.active{background:var(--primary-soft); border-color:var(--line2)}

.side-user .su-txt{min-width:0; display:flex; flex-direction:column; flex:1}

.side-user .su-chev{margin-left:auto; color:var(--muted); display:flex; align-items:center}

.side-user:hover .su-chev{color:var(--text)}

/* 用户中心页面 */
.prof-head{display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin:6px 0 18px}

.prof-avatar{width:76px; height:76px; border-radius:50%; background:var(--text); color:var(--bg); display:flex;
  align-items:center; justify-content:center; font-weight:800; font-size:28px; flex-shrink:0;
  overflow:hidden; box-shadow:0 6px 18px -10px rgba(0,0,0,.45)}

.prof-avatar img{width:100%; height:100%; object-fit:cover; display:block}

.prof-head-act{display:flex; flex-direction:column; gap:8px; min-width:0}

.prof-head-act .row{gap:8px; flex-wrap:wrap}

/* v2.7.2（需求 5）：用户中心按钮默认浅色，鼠标悬停/按下才转深色，且用主题色 —— 与侧栏导航同一套语言 */
#page-profile .btn{background:var(--panel); border:1px solid var(--line2); color:var(--text)}

#page-profile .btn:hover{background:var(--primary-soft); border-color:var(--primary); color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft)}

#page-profile .btn:active{background:var(--primary); border-color:var(--primary); color:var(--btn-fg); transform:scale(.97)}

#page-profile .btn-primary{background:var(--primary-soft); color:var(--primary);
  border:1px solid color-mix(in srgb, var(--primary) 35%, transparent)}

#page-profile .btn-primary:hover{background:var(--primary); border-color:var(--primary); color:var(--btn-fg)}

#page-profile .btn-primary:active{background:var(--primary2, var(--primary)); color:var(--btn-fg)}

.side-user .avatar{width:34px; height:34px; border-radius:50%; background:var(--text); color:var(--bg); display:flex; align-items:center; justify-content:center; font-weight:750; font-size:14px; flex-shrink:0; box-shadow:0 4px 10px -4px rgba(0,0,0,.45); overflow:hidden}

/* 头像图片必须被限制在框内：原来只有 #prof-avatar 有 img 的尺寸规则，
   侧栏那个 34px 的圆里塞进 192px 的原图就会溢出（v2.6.2 修） */
.side-user .avatar img,.prof-avatar img{width:100%; height:100%; object-fit:cover; display:block; border-radius:inherit}

.side-user .un{font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.side-user .ut{font-size:11px; color:var(--muted)}

.main{flex:1; padding:28px 34px 70px; max-width:1180px; margin:0 auto; width:100%;
  transition:padding-left .3s var(--ease-side)}

#bottom-nav{display:none; position:fixed; left:0; right:0; bottom:0; z-index:800; background:var(--panel); border-top:1px solid var(--line); padding:4px 8px calc(4px + env(safe-area-inset-bottom, 0px)); backdrop-filter:blur(12px); background:color-mix(in srgb, var(--panel) 88%, transparent)}

#bottom-nav .bnav-btn{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:7px 4px; min-height:56px; font-size:12px; font-weight:650; color:var(--muted); border-radius:12px; transition-property:background-color,color; transition-duration:140ms; transition-timing-function:ease-out}

#bottom-nav .bnav-btn .ico{width:22px; height:22px; display:flex; align-items:center; justify-content:center}

#bottom-nav .bnav-btn .ico .ico-svg{width:22px; height:22px}

#bottom-nav .bnav-btn.active{color:var(--primary); background:var(--primary-soft)}
@media (max-width:860px){
  .shell{flex-direction:column}

  .sidebar{display:none}

  #bottom-nav{display:flex}

  /* 手机端导航交给底部栏，不要三条杠；折叠态的主区留白也要复位 */
  .side-toggle{display:none}

  html.side-collapsed .main{padding-left:15px}

  .main{padding:18px 15px calc(84px + env(safe-area-inset-bottom, 0px))}

  #toast-wrap{top:calc(12px + env(safe-area-inset-top, 0px)); bottom:auto; left:12px; right:12px; max-width:none; align-items:center}

  .toast{animation:slideDown .22s ease-out}}
@media (max-width:720px){
  .topbar h1{font-size:21px}

  .auth-wrap{padding:24px 16px; align-items:flex-start}

  .auth-card{width:100%; max-width:460px; margin:0 auto; padding:32px 22px 26px}

  .auth-brand{font-size:22px}

  .field input{font-size:16px}

  .auth-card .btn-lg{width:100%; padding:14px; font-size:16px}

  .card{padding:18px}

  .modal{padding:20px 16px}

  .search-row{flex-direction:column; align-items:stretch}

  .search-row input{min-width:0; width:100%}

  .search-row select{width:100%}

  .stat{padding:15px}

  .stat-ico{width:40px; height:40px; border-radius:12px}

  .stat-ico .ico-svg{width:20px; height:20px}

  .stat .v{font-size:21px}

  .kv{flex-wrap:wrap}

  .kv .vv{word-break:break-all}

  .tabs button{padding:8px 13px}

  .tabs{overflow-x:auto; flex-wrap:nowrap; justify-content:flex-start}}
@media (max-width:480px){
  .btn-lg{padding:11px 16px}

  .topbar .btn{padding:8px 12px}

  .auth-wrap{padding:16px 12px}

  .auth-card{padding:28px 18px 22px; border-radius:22px}

  .auth-brand{font-size:20px; letter-spacing:.16em}

  .stat .k{font-size:11.5px}}

@keyframes slideDown{from{opacity:0; transform:translateY(-14px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){
  .fc-btns .btn,.fc-btns .again .lb,.sidebar,.sidebar>*,.main,.side-toggle{transition-duration:.01ms !important}}

.fx-burst{position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none; z-index:60}

.fx-spark{position:absolute; left:0; top:0; transform:translate(-50%,-50%); animation:fx-float .72s ease-out forwards; opacity:0}

@keyframes fx-float{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.45)}
  16%{opacity:1}
  100%{opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.04) rotate(var(--rot))}
}

.reveal-in{animation:fx-reveal .26s cubic-bezier(.2,0,0,1)}

@keyframes fx-reveal{from{opacity:0; transform:translateY(9px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important}}


/* 词库选择项 */
.book-opt{display:flex; align-items:flex-start; gap:11px; padding:13px 15px; border:1px solid var(--line2); border-radius:14px; cursor:pointer; transition-property:border-color,background-color,box-shadow; transition-duration:150ms; transition-timing-function:ease-out; background:var(--panel); user-select:none}

.book-opt:hover{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft)}

.book-opt.sel{border-color:var(--primary); background:var(--primary-soft)}

.book-opt input{margin-top:5px; accent-color:var(--primary); width:16px; height:16px; flex-shrink:0}

.book-opt .bname{font-weight:700; font-size:14px; letter-spacing:-.005em}

.book-opt .binfo{font-size:12px; color:var(--muted); margin-top:2px}

.book-opt .bcount{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap; padding-top:2px; font-variant-numeric:tabular-nums}

.book-opt .status-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:5px}

.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:16px; background:var(--panel)}

.pager{display:flex; gap:10px; align-items:center; justify-content:center; margin-top:16px; font-size:13px; color:var(--muted); flex-wrap:wrap; font-variant-numeric:tabular-nums}


/* 通知与弹窗 */
#toast-wrap{position:fixed; right:18px; bottom:18px; z-index:999; display:flex; flex-direction:column; gap:10px; max-width:340px; pointer-events:none}

.toast{background:var(--panel); border:1px solid var(--line2); border-radius:14px; box-shadow:var(--shadow); padding:12px 16px; font-size:13.5px; display:flex; gap:10px; align-items:flex-start; animation:slidein .22s cubic-bezier(.2,0,0,1); pointer-events:auto}

.toast.ok i{color:var(--accent)}

.toast.err i{color:var(--danger)}

.toast.warn i{color:var(--warn)}

@keyframes slidein{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

.modal-mask{position:fixed; inset:0; background:rgba(0,0,0,.48); backdrop-filter:blur(4px); z-index:900; display:flex; align-items:center; justify-content:center; padding:20px}

.modal{background:var(--panel); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); width:100%; max-width:540px; max-height:86dvh; overflow:auto; overscroll-behavior:contain; padding:28px; animation:pop .18s cubic-bezier(.2,0,0,1)}

@keyframes pop{from{opacity:0; transform:scale(.97) translateY(4px)}to{opacity:1; transform:none}}

.modal h3{font-size:18px; margin-bottom:6px; letter-spacing:-.01em}

.modal .close{float:right; font-size:22px; color:var(--muted); line-height:1; padding:4px; border-radius:8px}

.modal .close:hover{color:var(--danger); background:var(--danger-soft)}

.modal p{font-size:14px; color:var(--muted)}

.spinner{width:16px; height:16px; border:2px solid var(--line2); border-top-color:var(--primary); border-radius:50%; display:inline-block; animation:spin .7s linear infinite}

@keyframes spin{to{transform:rotate(360deg)}}


.empty{padding:52px 20px; text-align:center; color:var(--muted)}

.empty .big{font-size:46px; margin-bottom:12px}

.placeholder-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px}

.ph-card{background:var(--panel); border:1px dashed var(--line2); border-radius:var(--radius); padding:24px; text-align:center; transition-property:border-color,background-color,scale; transition-duration:160ms; transition-timing-function:ease-out}

.ph-card:hover{border-color:var(--primary); scale:.985}

.ph-card .pico{font-size:34px; margin-bottom:10px}

.ph-card h4{font-size:15px; margin-bottom:4px}

.ph-card p{font-size:12.5px; color:var(--muted)}

.ph-card .soon{display:inline-block; margin-top:10px; font-size:11.5px; color:var(--warn); background:var(--warn-soft); padding:3px 11px; border-radius:999px; font-weight:700}

.ph-card.ready{border-style:solid; border-color:var(--accent); background:var(--accent-soft)}


.divider{height:1px; background:var(--line); margin:20px 0}

.kv{display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13.5px}

.kv:last-child{border-bottom:none}

.kv .kk{color:var(--muted); padding-top:8px}

.kv .vv{font-weight:600; text-align:right; display:inline-flex; align-items:center; gap:6px; justify-content:flex-end; min-width:0; font-variant-numeric:tabular-nums}

.kv .switch{flex-shrink:0}

.checkbox-line{display:flex; align-items:center; gap:9px; font-size:14px; cursor:pointer; min-height:44px}

.checkbox-line input{width:16px; height:16px; accent-color:var(--primary)}

.switch{position:relative; width:46px; height:26px; flex-shrink:0}

.switch input{opacity:0; width:0; height:0}

.switch .sl{position:absolute; inset:0; background:var(--line2); border-radius:999px; transition-property:background-color; transition-duration:180ms; transition-timing-function:ease-out; cursor:pointer}

.switch .sl::before{content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:var(--panel); border-radius:50%; transition-property:transform; transition-duration:180ms; transition-timing-function:cubic-bezier(.2,0,0,1); box-shadow:0 1px 3px rgba(0,0,0,.28)}

.switch input:checked + .sl{background:var(--primary)}

.switch input:checked + .sl::before{transform:translateX(20px)}

.switch input:focus-visible + .sl{box-shadow:0 0 0 3px var(--primary-soft)}

.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}

.chip{display:inline-flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line2); padding:5px 12px; border-radius:999px; font-size:12.5px; font-weight:650}

.chip .x{cursor:pointer; color:var(--muted); font-size:14px; line-height:1; padding:2px}

.chip .x:hover{color:var(--danger)}

.search-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}

.search-row input{flex:1; min-width:200px}

.preset-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

.preset-row select{max-width:250px}

.banner{display:flex; align-items:center; gap:12px; padding:14px 17px; border-radius:15px; font-size:13.5px; margin-bottom:18px; flex-wrap:wrap}

.banner.info{background:var(--primary-soft); color:var(--text); border:1px solid var(--line2)}

.banner.warn{background:var(--warn-soft); color:var(--text); border:1px solid var(--line2)}

.banner.ok{background:var(--accent-soft); color:var(--text); border:1px solid var(--line2)}

.banner .btn{margin-left:auto}

.note-box{background:var(--panel2); padding:13px 16px; border-radius:12px; font-size:13px; color:var(--muted); margin:12px 0; line-height:1.7}

.kbd{display:inline-block; background:var(--panel); border:1px solid var(--line2); border-bottom-width:2px; border-radius:7px; padding:1px 7px; font-size:12px; font-weight:700; margin:0 2px; color:var(--text); box-shadow:0 1px 0 var(--line2)}

.range{accent-color:var(--primary)}

input[type="range"]{accent-color:var(--primary); padding:0; border:none; background:transparent; min-height:28px}

input[type="range"]:focus-visible{box-shadow:none; outline:2px solid var(--primary); outline-offset:3px; border-radius:99px}


/* ============ StudyLens UI v3 · 整体重构层 ============
   统一运动/玻璃/留白 token；分类改为 留白分区 + 列表 + 通栏色块 + 竖向分割线 */
:root{
  --ease:cubic-bezier(.2,0,0,1);
  --ease-side:cubic-bezier(.32,.72,0,1);   /* v2.7.2：侧栏折叠/按钮融合共用（必须写在 :root 里，写在顶层会被整条丢弃） */
  --ease-out:cubic-bezier(.22,1,.36,1);
  --dur:170ms; --dur-slow:340ms;
  --space-xs:6px; --space-sm:10px; --space-md:16px; --space-lg:26px; --space-xl:40px;
  --glass:rgba(248,248,250,.76); --glass-strong:rgba(248,248,250,.92);
  --glass-line:rgba(0,0,0,.08);
  /* 环境光斑：原来是紫/绿/蓝，现在只留灰阶深浅 */
  --amb-a:rgba(0,0,0,.05); --amb-b:rgba(0,0,0,.035); --amb-c:rgba(0,0,0,.025);
  --skel-hi:rgba(255,255,255,.75);
}

[data-theme="dark"]{
  --glass:rgba(26,26,31,.62); --glass-strong:rgba(26,26,31,.84);
  --glass-line:rgba(255,255,255,.08);
  --amb-a:rgba(255,255,255,.055); --amb-b:rgba(255,255,255,.04); --amb-c:rgba(255,255,255,.025);
  --skel-hi:rgba(255,255,255,.06);
}

body{position:relative}

/* 沉浸式环境光：整站呼吸感的底色来源（静态、低对比，不干扰阅读） */
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(1100px 560px at 12% -10%, var(--amb-a), transparent 62%),
    radial-gradient(900px 620px at 105% 30%, var(--amb-c), transparent 60%),
    radial-gradient(760px 520px at 50% 118%, var(--amb-b), transparent 62%);
}


/* ---- 液态玻璃工具层（用于悬浮式界面元素） ---- */
.sidebar,#bottom-nav,#english-tabs,.auth-card,.modal{
  background:var(--panel);
}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .sidebar,#bottom-nav,#english-tabs,.auth-card,.modal{
    background:var(--glass);
    -webkit-backdrop-filter:blur(22px) saturate(1.35);
    backdrop-filter:blur(22px) saturate(1.35);
  }}

.sidebar,#bottom-nav{border-color:var(--glass-line)}


/* ---- 登录页：沉浸式背景 ---- */
.auth-wrap{position:relative; overflow:hidden; isolation:isolate;
  background:
    radial-gradient(1200px 700px at 16% -12%, var(--amb-a), transparent 58%),
    radial-gradient(1000px 640px at 96% 18%, var(--amb-c), transparent 60%),
    radial-gradient(900px 700px at 60% 130%, var(--amb-b), transparent 58%),
    var(--bg)}

.auth-wrap::before,.auth-wrap::after{content:""; position:absolute; border-radius:50%; pointer-events:none; z-index:0;
  filter:blur(46px); opacity:.5; will-change:transform}

.auth-wrap::before{width:360px; height:360px; left:-90px; top:-70px;
  background:radial-gradient(circle at 35% 35%, rgba(120,120,125,.34), transparent 68%);
  animation:orb-drift-a 26s var(--ease-out) infinite alternate}

.auth-wrap::after{width:420px; height:420px; right:-120px; bottom:-130px;
  background:radial-gradient(circle at 62% 40%, rgba(120,120,125,.26), transparent 68%);
  animation:orb-drift-b 32s var(--ease-out) infinite alternate}

@keyframes orb-drift-a{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(60px,44px,0) scale(1.12)}}

/* ============ StudyLens UI v5 · 性能层 ============
   原则：观感不变，减少持续性的 GPU 合成与主线程长任务。
   1) 大尺寸/随内容滚动的表面不再做逐帧 backdrop blur（保留玻璃色调）；
   2) 模糊动效改为纯渐变光斑（无 filter:blur），移动端不再持续重绘；
   3) 重型排版（text-wrap:pretty）不再作用于表格单元格与列表项。 */
html{scroll-behavior:auto}


/* 大面积、贴滚动内容的玻璃表面：保留色调，去掉逐帧模糊 */
.sidebar{background:var(--glass-strong); -webkit-backdrop-filter:none; backdrop-filter:none}

#bottom-nav{background:color-mix(in srgb, var(--panel) 93%, transparent); -webkit-backdrop-filter:none; backdrop-filter:none}


/* 登录光斑：用柔和渐变代替 46px 模糊滤镜（视觉一致，GPU 成本大幅下降） */
.auth-wrap::before,.auth-wrap::after{filter:none}

.auth-wrap::before{background:radial-gradient(circle at 38% 38%, rgba(150,150,155,.34), rgba(150,150,155,.10) 46%, transparent 70%)}

.auth-wrap::after{background:radial-gradient(circle at 55% 45%, rgba(190,190,195,.30), rgba(190,190,195,.08) 48%, transparent 72%)}


/* 静态展示的玻璃仍保留（登录卡、弹窗） */
.auth-card,.modal{-webkit-backdrop-filter:blur(18px) saturate(1.3); backdrop-filter:blur(18px) saturate(1.3)}


/* 重型排版只保留在段落；表格/列表恢复常规排布 */
p{text-wrap:pretty}

li,td,th{text-wrap:normal}


/* 悬停阴影转场改为合成器友好属性，避免逐像素重绘 */
.stat,.ph-card{transition-property:translate,background-color,border-color; transition-duration:var(--dur)}

.stat:hover,.ph-card:hover{box-shadow:none}

.card,.lib-row,.book-opt,.modal{transition-property:background-color,border-color,translate,scale}


/* ============ StudyLens UI v6 · 体验升级层 ============
   首启引导 / 三档反馈 + 发音 / 数学路线图 / 页面转场 */
@keyframes pageIn{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}

#view-main .main > section{animation:pageIn .2s var(--ease)}

#view-main:not([hidden]){animation:appIn .34s var(--ease-side) both}

@keyframes appIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

/* v2.7.4：整页平移期间由 transform 接管 —— CSS 动画优先级高于 transition，
   不关掉 pageIn 的话 translateX 会被动画的 translateY 顶掉（表现为瞬移无过渡） */
#main-area.is-sliding > section{animation:none}

#view-main .main > section[data-no-in]{animation:none}


/* 数学角标与路线图 */

/* ===== v2.7.3「开始学习」流带（呼吸右移 → 点击加速 → 平滑滑入学习界面）=====
   不是一块实心按钮，而是一条可交互的区域：淡底 + 1px 语义描边 + 呼吸光斑，右侧三枚 >>> 缓慢右移并呼吸。 */
.flow-band{position:relative; display:flex; align-items:center; justify-content:space-between; gap:14px;
  width:100%; min-height:64px; padding:0 18px; border-radius:18px; cursor:pointer; overflow:hidden;
  background:color-mix(in srgb, var(--primary) 7%, transparent);
  border:1px solid color-mix(in srgb, var(--primary) 28%, transparent); color:var(--text);
  font:inherit; text-align:left; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  transition:border-color .24s var(--ease), background-color .24s var(--ease),
             transform .24s var(--ease-side), box-shadow .24s var(--ease), color .24s var(--ease)}

.flow-band::before{content:''; position:absolute; inset:-40% -10%; pointer-events:none;
  background:radial-gradient(140px 76px at 20% 50%, color-mix(in srgb, var(--primary) 24%, transparent), transparent 70%);
  animation:fbBreath 3.6s var(--ease) infinite}

.flow-band::after{content:''; position:absolute; top:0; bottom:0; left:-46%; width:46%; pointer-events:none; opacity:0;
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--btn-fg) 34%, transparent), transparent)}

.flow-band:hover{border-color:color-mix(in srgb, var(--primary) 48%, transparent);
  background:color-mix(in srgb, var(--primary) 9%, transparent);
  box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 10%, transparent)}

.flow-band:active{transform:scale(.995)}

.flow-band:focus-visible{outline:2px solid var(--primary); outline-offset:2px}

.fb-txt{display:flex; flex-direction:column; gap:2px; min-width:0}

.fb-main{font-size:18px; font-weight:800; letter-spacing:-.01em}

.fb-sub{font-size:12.5px; color:var(--muted)}

.fb-arrows{display:flex; align-items:center; flex:none; color:var(--primary); overflow:hidden; padding:2px 2px 2px 6px}

.fb-arrows .ico-svg{width:22px; height:22px; stroke-width:2.6}

/* v2.7.5：>>> 改成「传送带」——每枚箭头在窗口左侧淡入、一路右移、在右侧淡出，
   0% 与 100% 的透明度都是 0，所以循环回卷的那一帧完全看不见，不再出现「跳回左边」的生硬感。
   三枚错相叠加成连续波浪；整组再极轻微地前倾，读起来是隐隐向前，而不是在抖。 */
.fb-arrows .arw{display:flex; animation:fbFlow 3.2s cubic-bezier(.45,.06,.42,.96) infinite; opacity:0}

.fb-arrows .arw:nth-child(2){animation-delay:.42s}

.fb-arrows .arw:nth-child(3){animation-delay:.84s}

@keyframes fbFlow{
  0%{opacity:0; transform:translateX(-7px) scale(.90)}
  16%{opacity:1; transform:translateX(-2px) scale(1)}
  52%{opacity:1; transform:translateX(4px) scale(1)}
  82%{opacity:.45; transform:translateX(9px) scale(.97)}
  100%{opacity:0; transform:translateX(12px) scale(.93)}
}

@keyframes fbBreath{0%,100%{opacity:.4; transform:scale(1)} 50%{opacity:.85; transform:scale(1.06)}}

/* 点击：整条变实心（承诺）+ 一道光扫过 + >>> 切成快波（突然变快，但仍是同一条曲线，过渡不跳） */
.flow-band.go{background:var(--btn-solid); border-color:transparent; color:var(--btn-fg)}

.flow-band.go .fb-sub{color:color-mix(in srgb, var(--btn-fg) 74%, transparent)}

.flow-band.go .fb-arrows{color:var(--btn-fg)}

.flow-band.go .arw{animation:fbRush .34s cubic-bezier(.22,.61,.36,1) infinite}

.flow-band.go::before{animation-duration:1.2s}

.flow-band.go::after{animation:fbSweep .52s cubic-bezier(.4,0,.2,1) forwards}

/* 加速同样是「传送带」形状，只是快了 7 倍 —— 速度突变但位移轨迹连续，所以不会闪跳 */
@keyframes fbRush{
  0%{opacity:0; transform:translateX(-9px) scale(.92)}
  18%{opacity:1; transform:translateX(-2px) scale(1)}
  62%{opacity:1; transform:translateX(6px) scale(1)}
  100%{opacity:0; transform:translateX(15px) scale(.94)}
}

@keyframes fbSweep{0%{opacity:0; left:-46%} 18%{opacity:1} 100%{opacity:0; left:100%}}

/* 入口页左滑淡出 → 学习卡从右侧平滑滑入 */
.en-hero.setup-out,.card.setup-out{animation:setupOut .3s cubic-bezier(.4,0,1,1) forwards; pointer-events:none}

@keyframes setupOut{to{opacity:0; transform:translateX(-22px) scale(.996)}}

/* 概览页用的紧凑版（放在页头右侧，不占整行）
   v2.7.5：按需求「概览的开始不要有颜色」—— 这一条改成纯中性灰，连箭头也不吃主题色；
   学习入口那条（.flow-band 非 compact）保留主题色，作为「主行动」的识别。 */

.flow-band.compact .fb-arrows{color:var(--muted)}

.flow-band.compact .fb-sub{font-size:11.5px}

.flow-band.compact .fb-arrows .ico-svg{width:18px; height:18px}

@keyframes fbBreathSm{0%,100%{opacity:.4; transform:scale(1)} 50%{opacity:.8; transform:scale(1.04)}}

.flow-band.compact::before{animation-name:fbBreathSm}


/* ===== v2.7.4 视图迁移原语
   前进 fwd ：当前层向右退出、新层自左侧滑入（与 >>> 的方向一致）
   返回 back：当前层向左退出、新层自右侧滑入
   关键点：两层都是 absolute 且同时存在，容器锁住高度 —— 全程没有任何空窗，所以看不到接缝。 */
.is-sliding{position:relative; contain:paint}
      /* v2.7.5：把重绘限制在容器内，滑动时不再牵动整页 */
.view-layer{position:absolute; left:0; top:0; width:100%;
  will-change:transform; transform:translateZ(0); backface-visibility:hidden;
  transition:transform .46s var(--ease-side), opacity .46s var(--ease)}

.view-layer.from-left{transform:translateX(-100%)}

.view-layer.from-right{transform:translateX(100%)}

.view-layer.landed{transform:translateX(0)}

.view-layer.leave-right{transform:translateX(100%); opacity:.45}

.view-layer.leave-left{transform:translateX(-100%); opacity:.45}

/* v2.7.5（需求②）：退场的那一屏盖一层渐变遮罩，随退场淡入；入场层不加任何遮罩，
   所以「上一级」的内容始终是干净的。 */
.view-layer::after{content:''; position:absolute; inset:0; pointer-events:none; opacity:0;
  background:linear-gradient(100deg, color-mix(in srgb, var(--bg) 80%, transparent), color-mix(in srgb, var(--bg) 56%, transparent));
  transition:opacity .46s var(--ease)}

.view-layer.leave-left::after,.view-layer.leave-right::after{opacity:1}


/* ===== v2.7.9 / v2.7.10 全站「一上一下」上下平移 =====
   用户要求：所有点击切换都改成上下平移，并「参考开始学习/开始复习那套方案」——
   同一套两层预渲染平移，只是把位移从横向换成纵向。

   v2.7.10 按用户反馈修订：**要走的整屏干脆走出屏幕、要来的从屏幕一侧走到中间**。
   上一版退场层只往下沉 14% 并淡到 0.6，于是「旧屏还赖在屏幕上」，观感差；
   现在两层各自走**整整一个容器高度**（--sc-travel，像素值），任意一帧首尾相接：
     'up'   旧层向上整屏移出 + 新层自下方升到中间（一上一下）
     'down' 旧层向下整屏移出 + 新层自上方降到中间
   为什么用像素而不是 100%：百分比是「自身高度」的百分比，两层高度不等时中间会露空档。
   两层在过渡期间都撑到容器高度（.sc-tall），保证矮的那层也能把画面接住。 */
.view-layer.sc-from-below{ transform:translateY(var(--sc-travel, 100%)) }

.view-layer.sc-from-above{ transform:translateY(calc(var(--sc-travel, 100%) * -1)) }

.view-layer.sc-leave-up{ transform:translateY(calc(var(--sc-travel, 100%) * -1)) }

.view-layer.sc-leave-down{ transform:translateY(var(--sc-travel, 100%)) }

.view-layer.sc-settled{ transform:translateY(0) }

/* v2.7.13：平移期间把层裁成「恰好一屏」。
   长页面（学习记录 4000+px）整层参与合成时每帧都要重绘一大片，帧率掉下来就会被看成「跳」；
   裁成一屏之后合成面积只剩一个视口，而且屏幕外那部分本来也看不见。落地时类被移除，恢复原状。 */
.view-layer.sc-tall{ height:var(--sc-travel, 100%); overflow:hidden }

/* v2.7.17 修复（设置索引 → 内容，落地那一帧卡一下）：
   平移期间层被强制成一屏高（上面的 --sc-travel），而 .set-index 是网格容器，
   网格默认 align-content:stretch —— 行高被拉伸去填满这一屏，卡片从 118px 涨到 489px，
   落地（层回到自然高度）那一帧再缩回来，就是看得见的一跳。
   实测：卡片顶 129px 没动、高度 489 → 118（差 371px）。改成按内容排布即彻底消除。 */
/* 只改 align-content（这是「行」的分布）：行高回到内容高，就不会被拉去填满一屏。
   不能顺手改 align-items —— 那会让同一行的卡片各自按内容缩高（实测 94px vs 天然 118px），
   落地时同样是一跳。 */
.set-index.sc-tall{ align-content:start }

/* 纵向平移的「起始位移」提交阶段：先关过渡摆好位置，下一帧再打开过渡并开始跑 */
/* ===== v2.7.17 设置索引页 + 概览主行动条（样式） ===== */

/* ===== v2.7.17 设置：索引一屏 + 内容一屏 ===== */

 .set-card{ padding:14px }}


.view-layer.sc-init{ transition:none !important }

/* ===== v2.7.11（用户反馈：自适应「一帧跳」）=====
   两条路一起走：
   ① 事先对齐 —— 首屏的缩放 / 渲染 / 自适应全部在用户看不见的时候算完（见 showMain()），
      页面切换时的自适应也在目标页还在屏幕外时算完（见 slideLayers 的预量测）。
   ② 真的一帧后必须自适应时，让它平滑过渡而不是硬跳 —— 根缩放（zoom）在 Edge/Chromium 里
      是可以补间的（实测 1 → 1.3 平滑走完），所以给 html 挂一条过渡；为避免适配引擎在过渡途中
      量到中间值，这条过渡只在「首屏显示之后」才开启（.zoom-anim），且 applyScale() 会把随后的
      适配复核推迟到过渡结束。 */
html.zoom-anim{ transition:zoom .34s var(--ease) }

/* 首屏那几帧里，异步内容（头像/统计）会让整页高度差几像素，浏览器默认的「滚动锚定」会顺手把
   整页顶一下（实测 6–9px）。关掉它，几像素的收尾也不会被放大成「屏幕动了一下」。 */
html{ overflow-anchor:none }

/* 退场的那一屏带一层渐变遮罩（随它一起移出屏幕），进入层始终干净。
   纵向的层位移走内联样式（见 slideLayers），所以这里按「容器在纵向平移 + 这一层是退场层」来挂遮罩。 */
.sc-vert .view-layer.is-leaving::after,
.view-layer.sc-leave-up::after,
.view-layer.sc-leave-down::after{
  opacity:1;
  background:linear-gradient(to bottom,
    color-mix(in srgb, var(--bg) 78%, transparent),
    color-mix(in srgb, var(--bg) 50%, transparent))
}

/* 纵向平移期间容器不再铺底色：实测给「词表筛选」这种超长容器铺背景会触发整面重绘，
   单帧冲到 168ms；旧层下沉露出的那 14% 本来就是页面底色，不铺也一样。 */
/* 参与纵向平移的容器必须有定位上下文（锁高 + 绝对定位的层才有着落） */
#en-views,.set-panes{ position:relative }

/* 平移期间关掉入场动画：旧层被放回来时不重播，免得出现空档 */
#en-views>[data-no-in]>.card,
.set-pane[data-no-in]{ animation:none }


/* ===== v2.7.8 无界并列 / 渐变分割线 / 右下角小字入口 ===== */

/* ⑥ 三、四列并列的数字块：取消外框，只留一条极简渐变分割线 */
.grid-4 > .stat,
.filter-summary .stat,
.en-num{ position:relative }

.grid-4 > .stat::after,
.filter-summary .stat + .stat::after,
.en-num + .en-num::after{
  content:''; position:absolute; left:0; top:14%; bottom:14%; width:1px; pointer-events:none;
  background:linear-gradient(to bottom, transparent, var(--line2) 22%, var(--line2) 78%, transparent)
}

.grid-4 > .stat:first-child::after{ display:none }


/* 四列块折成两列（≤1080）：分割线只留在每行第二个；单列（≤640）全部收起 */
@media (max-width:1080px){
  .grid-4 > .stat::after{ display:none }
  .grid-4 > .stat:nth-child(even)::after{ display:block }
}
@media (max-width:640px){
  .grid-4 > .stat::after{ display:none !important }}

.en-num{ background:transparent; border:0; border-radius:0; padding:8px 4px }


/* ④ 词库数据来源：右下角无框小字入口（图标 + 文字，点击弹说明） */
.corner-note{
  position:fixed; right:26px; bottom:22px; z-index:7;

/* ===== v2.7.7 自适应平滑化 =====
   元素尺寸被自适应引擎改动时不再硬跳：字号与锁高都走过渡。
   .fitting 期间（引擎正在逐像素试缩）关闭过渡，否则量到的是动画中间值，会越算越偏。 */

/* ===== v2.7.5 掉帧优化：滑动期间把「贵」的东西全部停掉 =====
   毛玻璃（backdrop-filter）与大面积模糊阴影在元素每帧位移时会反复重算，是这次掉帧的主因；
   呼吸光斑与 >>> 的无限动画也会让被移动的图层每帧重绘。滑动期间统一停用，落定即恢复。 */
.is-sliding .flow-band,

.is-sliding .flow-band,

const fmtDate = ts => { const d = new Date(ts); const m = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'][d.getMonth()]; return m+' '+d.getDate()+'日'; };
const relTime = ts => {
  if(!ts) return '';
  const diff = now() - ts;
  if(diff < 60000) return '刚刚';
  if(diff < 3600000) return Math.floor(diff/60000)+' 分钟前';
  if(diff < 86400000) return Math.floor(diff/3600000)+' 小时前';
  if(diff < 7*86400000) return Math.floor(diff/86400000)+' 天前';
  return fmtDate(ts);
};
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function download(name, content, type){
  const blob = new Blob([content], {type: type || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
}

function clearBandGo(){ $$('.flow-band.go').forEach(b => b.classList.remove('go')); }

/* ── 来自站点 template.html 第 2033–2045 行：withRenderTarget()（不可见预渲染原语） ── */
function withRenderTarget(id, el, fn){
  const box = document.getElementById(id);
  const oldId = box ? box.id : null;
  if(box) box.id = '__sl_hidden_' + id;
  el.id = id;
  try{ fn(); }
  finally{ el.id = ''; if(box) box.id = oldId; }
}
/* ===== v2.7.9 切换方向统一在这里决定（用户要求：全站都改成「旧的下去、新的上来」）=====
   语义统一成「前进 / 返回」两个意图，具体怎么动由模式决定：
     v（默认，纵向）：前进 = 旧层下沉 + 新层自下方升上来；返回 = 旧层下退出 + 新层自上方降下
     h（对照，横向）：v2.7.4 起就在用的左右平移（保留下来做 A/B 逐帧对比）
   探针用 window.__SL_SWITCH_MODE = 'h' 就能把全站切回横向，跑同一条路径对比两种方案。 */

/* ── 来自站点 template.html 第 2046–2242 行：切换方向（SWITCH/switchMode/layerEntryClass/layerDir）+ SLIDE_DUR + slideLayers() 整段迁移动画 ── */
const SWITCH = { mode: 'v' };
function switchMode(){
  try{ const m = window.__SL_SWITCH_MODE; return (m === 'h' || m === 'v') ? m : SWITCH.mode; }
  catch(e){ return SWITCH.mode; }
}
/* 进入层的起始类名（先摆到画布外，避免闪一帧） */
function layerEntryClass(fwd){
  if(switchMode() === 'h') return fwd ? 'from-left' : 'from-right';
  return fwd ? 'sc-from-below' : 'sc-from-above';
}
/* 传给 slideLayers 的方向 */
function layerDir(fwd){
  if(switchMode() === 'h') return fwd ? 'fwd' : 'back';
  return fwd ? 'up' : 'down';
}
/* v2.7.13：纵向滑动的时长与缓动。
   缓动必须是对称的 ease-in-out —— 起步慢、中段快、收尾慢，才不会「一帧窜到中间」。
   （--ease-side 是给横向那套用的，起步极快，纵向用它会像瞬移。） */
const SLIDE_DUR = 520;
const SLIDE_EASE = 'transform ' + SLIDE_DUR + 'ms cubic-bezier(.42,0,.24,1)';

/* dir: 'fwd' = 当前层向右退出、新层自左滑入；'back' = 当前层向左退出、新层自右滑入
   dir: 'up'  = 当前层向上整屏移出、新层自下方升到中间（一上一下）
   dir: 'down'= 当前层向下整屏移出、新层自上方降到中间
   opts.keepCur = true 时旧层只隐藏不删除（页面级 section 是常驻元素，删掉就回不来了） */
function slideLayers(container, cur, next, dir, done, opts){
  const D = SLIDE_DUR;                                // v2.7.13：与纵向滑动的过渡时长保持一致（520ms）
  const o = opts || {};
  if(!container || !cur || !next){ done && done(); return; }
  const V = (dir === 'up' || dir === 'down');
  const CLS = ['view-layer', 'from-left', 'from-right', 'landed', 'leave-left', 'leave-right',
               'sc-from-below', 'sc-from-above', 'sc-settled', 'sc-leave-up', 'sc-leave-down',
               'sc-tall', 'sc-init', 'is-entering', 'is-leaving'];
  const h0 = Math.max(cur.offsetHeight || 0, next.offsetHeight || 0, 220);
  const anchor = cur.offsetTop || 0;                  // 新层要顶替旧层的位置（页面区顶部有 34px 留白）
  cur.setAttribute('data-no-in', '');                 // 迁移期间与结束后都不再重放入场动画
  next.setAttribute('data-no-in', '');
  container.classList.add('is-sliding');
  if(V) container.classList.add('sc-vert');
  /* 给两层打上「进入层 / 退场层」标记类（与方向无关）：
     探针与后续维护都靠它选元素，不必再记住 from-left/leave-right/sc-* 这些方向类名 */
  next.classList.add('is-entering');
  cur.classList.add('is-leaving');
  let h = h0;
  let travel = 0;                                    // ⚠️ 必须提到函数作用域：动画起点的计算要用
  let scrollY0 = 0;                                  // ⚠️ 同上：进/退场层的起点都要按滚动量补偿
  if(V){
    /* ===== v2.7.12（用户反馈：无论从哪切到哪都会跳一下）=====
       先把「这一次切换落地后每个元素的真实位置」量出来，再照着它摆图层 ——
       也就是用户要求的那套：先在不被看见的地方把这次跳转预演一遍、逐个元素对齐、记录位置，
       然后把记录下来的位置应用到用户实际看到的那一帧上。
       量出来的关键差异：绝对定位的层的包含块是容器的 **padding box**，
       而流内元素从 **content box** 开始 —— 不校正的话层会宽出「左右内边距之和」、
       并整体左移一个内边距（本机实测：宽 +68px、左 -34px）。
       于是落地（去掉图层类、回到正常流）的那一帧，整屏内容「啪」地量变一次。
       现在两层都按测量出来的流内外框摆放，落地前后完全重合。 */
    const ccs = getComputedStyle(container);
    const padL = parseFloat(ccs.paddingLeft) || 0, padR = parseFloat(ccs.paddingRight) || 0;
    const padT = parseFloat(ccs.paddingTop) || 0;
    const contentW = Math.max(0, container.clientWidth - padL - padR);
    /* 内容框 = 容器的 padding box 去掉左右/上内边距。退场层的基准不能量它自己的外框：
       此刻目标页也已取消隐藏、并且排在 DOM 前面，cur 在正常流里被挤到目标页下方
       （实测偏下 432px，一切都跟着跳）。 */
    /* ===== v2.7.13（用户反馈：还是跳一下；要求「先跳完再弹出」）=====
       ① 把「滚动归零」这一下挪到用户看不见的时候：
          用户滚到页面中间再点导航时，go() 结尾的 window.scrollTo(0) 发生在图层已经就位之后，
          整屏（含图层）会瞬移一个滚动量 —— 实测一帧位移 600px（滚动 300 + 首帧位移），
          这就是「页面滚着切页必跳」的来源。
          做法（顺序很关键，全在同一个任务里、浏览器一次都没绘制）：
            a. 先把退场层绝对化到**落位后的位置**（top = 内容框顶），并把它「按用户当前滚动量
               往回压」——于是它在屏幕上的位置与用户刚看到的一模一样；
            b. 再把滚动归零：此刻两层都已经是图层，画面不会有任何变化；
            c. 之后所有量测与动画都在「滚动为 0」的坐标里做，落地（回正常流、滚动也是 0）天然重合。
       ② 缓动曲线换成对称的 ease-in-out：原来的 --ease-side 在前 32% 时间里就走完 72% 的距离，
          一帧能窜 180–300px —— 那正是「上一帧还在角落、下一帧就到中间」的直接原因。 */
    scrollY0 = window.scrollY || 0;
    cur.classList.add('view-layer');
    cur.style.top = padT + 'px';
    cur.style.left = padL + 'px';
    cur.style.width = contentW + 'px';
    cur.style.transform = 'translateY(' + (-scrollY0) + 'px)';   // 压回用户当前看到的位置
    cur.style.zIndex = '1';
    try{ window.scrollTo(0, 0); }catch(e){}
    try{ if(container.scrollTop) container.scrollTop = 0; }catch(e){}
    /* ⚠️ 容器外框必须在「滚动归零之后」再量：归零前量到的 top 差一个滚动量，
       量进层位置就会整体偏一个滚动量（实测偏 300px，落地时又是一跳）。 */
    const cRect = container.getBoundingClientRect();
    next.style.position = 'static';                   // 让新层以正常流参与一次布局（这一步用户看不见）
    next.style.top = ''; next.style.left = ''; next.style.width = '';
    try{
      if(typeof fitStudyViewport === 'function') fitStudyViewport();
    }catch(e){}
    const nextGeo = next.getBoundingClientRect();     // ← 记录：落地后的真实外框
    next.style.position = '';
    const hAfter = Math.max(cur.offsetHeight || 0, next.offsetHeight || 0, 220);
    h = hAfter;
    /* v2.7.14（用户反馈：移动端完全不跳、桌面端最后一帧还有细微跳动）=====
       真凶就是这里的单位：getBoundingClientRect() 返回的是**视觉像素**（已经被根元素 zoom 放大过），
       而 style.left/width/top 认的是**CSS 像素**。
       zoom = 1（移动端不自动缩放）时两者相等，所以移动端完美；
       桌面端 zoom = 1.15 / 1.3 时，写进去的宽度会再被放大一次 ——
       实测落地那一帧：1440 下宽度 1239 → 1077（差 162px = 1239×(1−1/1.15)），
       1920 下 1880 → 1446（差 434px），图标位移更是差了 435px。
       修法：把量到的视觉像素统统除以根缩放，换算回 CSS 像素再写。 */
    const zRoot = _rootZoom();
    /* 行程取「内容高」与「容器可视高」的较大者：内容比视口矮时（概览页只有 508px），
       只按内容高走会让新层起点落在视口内 —— 用户会先看见新页从下方露一截。
       取一个可视高度后新层起点必然在视口外；两层又都撑到这个高度（.sc-tall），
       任意一帧首尾相接、不露空档。 */
    /* 行程取「一屏」而不是「内容高」：内容很高的页面（学习记录 4000+px）若按内容高走，
       一帧要窜几百像素，看着就是跳；进入层落在最上面并且盖满一屏，旧页的其余部分自然被盖住。
       内容比视口矮时（概览页 508px）行程也还是一屏，新层起点才会落在视口外。 */
    travel = Math.max(container.clientHeight || 0, 220);
    container.style.setProperty('--sc-travel', travel + 'px');
    /* 位移用**内联样式**写死，不用类名（类名会被后定义的类按样式表顺序顶掉）。
       另外必须先用 .sc-init 关掉过渡把「起始位移」提交下去：上面那次预量测强制过一次样式结算，
       浏览器因此有了「变更前样式」，若此时才一起加上 transition，它会从 0 补间到起始位移 ——
       表现就是新层先在原地出现、再慢慢滑下去（探针量到 tY 从 0 涨到 900）。 */
    next.classList.add('view-layer', 'sc-tall');
    // 量到的是视觉像素 → 除以根缩放换算成 CSS 像素（zoom=1 时不变，移动端行为完全一致）
    next.style.left = Math.round((nextGeo.left - cRect.left) / zRoot) + 'px';
    next.style.width = Math.round(nextGeo.width / zRoot) + 'px';
    next.style.top = Math.round((nextGeo.top - cRect.top) / zRoot) + 'px';
    next.style.zIndex = '2';                          // 新层在上，接缝处不会露出下层
    next.style.transform = 'translateY(' + (dir === 'up' ? travel : -travel) + 'px)';
    cur.classList.add('sc-tall');
    cur.style.transform = 'translateY(' + (-scrollY0) + 'px)';   // 从「用户当前看到的位置」出发
  } else {
    next.classList.add('view-layer', dir === 'fwd' ? 'from-left' : 'from-right');
  }
  container.style.minHeight = h + 'px';
  next.getBoundingClientRect();                       // 强制重排：先把起始位移落定
  /* ===== v2.7.13：位移用 Web Animations 驱动 =====
     之前用「加 .sc-init 关过渡 → 下一帧去掉再加 transition」的写法有两个隐患：
     去掉 sc-init 与改 transform 发生在同一次样式结算里，浏览器可能仍按「变更前」的过渡设置处理，
     于是这一帧直接跳到位（滚动场景里实测一帧 494px 就是这么来的）。
     改成显式关键帧：起点、终点、时长、缓动一次性交给浏览器，不存在「过渡没生效」的窗口。
     缓动是对称 ease-in-out —— 起步慢、中段快、收尾慢，一帧最多走总行程的 ~1/12。 */
  if(V){
    const dur = SLIDE_DUR, ease = 'cubic-bezier(.42,0,.24,1)';
    const from = { cur: -scrollY0, next: dir === 'up' ? travel : -travel };
    const to = { cur: (dir === 'up' ? -travel : travel) - scrollY0, next: 0 };
    try{
      cur.__scAnim = cur.animate(
        [{ transform: 'translateY(' + from.cur + 'px)' }, { transform: 'translateY(' + to.cur + 'px)' }],
        { duration: dur, easing: ease, fill: 'both' });
      next.__scAnim = next.animate(
        [{ transform: 'translateY(' + from.next + 'px)' }, { transform: 'translateY(' + to.next + 'px)' }],
        { duration: dur, easing: ease, fill: 'both' });
    }catch(e){}
  } else {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      cur.classList.add('view-layer', dir === 'fwd' ? 'leave-right' : 'leave-left');
      next.classList.add('landed');
    }));
  }
  setTimeout(() => {
    cur.classList.remove.apply(cur.classList, CLS);
    // v2.7.8：被保留（隐藏）的旧页把 data-no-in 摘掉 —— 它此刻不可见，
    // 摘掉不会重播动画，却能保证「以后普通切页」仍然有 pageIn 入场动画。
    // v2.7.9：还要防「滑动没结束用户又点了一次」—— 那时旧页可能已经重新变成当前页，
    // 不能再把它藏起来（否则两个页面全被隐藏，屏幕上什么都没了）。以 AppUI.page 为准。
    if(o.keepCur){
      const stillCurrent = !!(cur.id && cur.id.indexOf('page-') === 0 &&
                              typeof AppUI !== 'undefined' && AppUI && AppUI.page === cur.id.slice(5));
      cur.hidden = !stillCurrent;
      cur.removeAttribute('data-no-in');
    }
    else cur.remove();
    next.classList.remove.apply(next.classList, CLS);
    cur.style.zIndex = ''; next.style.zIndex = '';
    cur.style.top = ''; next.style.top = '';
    cur.style.left = ''; next.style.left = '';               // 清掉对齐用的内联几何（回正常流后由布局说了算）
    cur.style.width = ''; next.style.width = '';
    cur.style.transform = ''; next.style.transform = '';     // 清掉内联位移（阶段结束后样式表说了算）
    // v2.7.13：动画是 Web Animations 起的，收尾时先取消（fill:both 会一直占着属性）
    try{ if(cur.__scAnim){ cur.__scAnim.cancel(); cur.__scAnim = null; } }catch(e){}
    try{ if(next.__scAnim){ next.__scAnim.cancel(); next.__scAnim = null; } }catch(e){}
    container.classList.remove('is-sliding');
    container.classList.remove('sc-vert');
    container.style.minHeight = '';
    container.style.removeProperty('--sc-travel');
    // v2.7.10（用户反馈 4）：这里**不再**做落地后的复核自适应。
    // 用户要的是「在看不见的地方先适应好，再呈现」，落地后再改尺寸就是屏幕上动一下。
    // 框架注：站点在这里还有一步「学习卡在平移中预量高度」的业务适配，已移除。
    // 通用做法见《03-Agent 使用指南》：任何依赖尺寸的复核都要在用户看不见的那一帧里做完。
    done && done();
  }, D + 60);
}

/* v2.7.8（需求 4）：词库数据来源的「右下角小字入口」显隐开关。
   为什么不用纯 CSS：入口挂在 <body> 下、位置固定在视口右下角，而它所属的
   「词库中心」其实是设置页里的一个面板（mountLibraryPane 会把 #page-library
   搬进 #set-pane-library），所以显隐只能跟着面板状态走。
   也不能把它留在 #page-library 里面：#view-main 上带着入场动画残留的 transform
   （animation-fill-mode 收尾成 matrix(1,0,0,1,0,0)），会变成 fixed 的包含块，
   入口就被顶到页面外面去了（实测 bottom 1007px > 视口 900px）。 */

/* ── 来自站点 template.html 第 2253–2258 行：Store（localStorage 封装） ── */
const Store = {
  get(k, def){ try{ const v = localStorage.getItem('sl.'+k); return v==null ? def : JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem('sl.'+k, JSON.stringify(v)); }catch(e){ console.warn('本地存储失败', e); if(!Store._warned){ Store._warned = true; setTimeout(()=>{ try{ toast('无法保存进度：当前可能为无痕模式或存储空间已满。请退出无痕窗口或导出备份。','err'); }catch(_){} }, 60); } } },
  remove(k){ try{ localStorage.removeItem('sl.'+k); }catch(e){} }
};


/* ── 来自站点 template.html 第 2260–2512 行：Supa（云端 RPC 适配：注册/登录/保存/读取/删除 + 同步泵 + 冲突标记） ── */
const Supa = {
  cfg: null,
  tried: false,
  _busy: false,
  _dirty: false,
  _gen: 0,             // 改动代数：每次 onDataChanged 自增，用来识别「上传期间又有改动」
  _retryTimer: null,
  _watchTimer: null,
  lastOk: null,
  lastErr: null,
  _hadRemote: false,
  _syncedAt: 0,        // 已同步到的服务端 updated_at（判断云端是否真有更新）
  init(){
    try{
      if(window.SiteDB && window.SiteDB.config && window.SiteDB.config.url && window.SiteDB.config.key){
        this.cfg = {
          url: String(window.SiteDB.config.url).replace(/\/+$/, ''),
          key: String(window.SiteDB.config.key)
        };
      }
    }catch(e){ this.cfg = null; }
  },
  active(){
    if(!this.cfg && !this.tried){ this.tried = true; this.init(); }
    return !!this.cfg;
  },
  /* 调用 SECURITY DEFINER 函数（数据库已锁表，读写只走函数+访问令牌） */
  async rpc(name, args){
    if(!this.active()) throw new Error('云端数据库未接入');
    const r = await fetch(this.cfg.url + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: {
        'apikey': this.cfg.key,
        'Authorization': 'Bearer ' + this.cfg.key,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(args || {})
    });
    if(!r.ok){
      let msg = '云端请求失败 ' + r.status;
      try{ const j = await r.json(); if(j && (j.message || j.msg)) msg = j.message || j.msg; }catch(e){}
      throw new Error(msg);
    }
    return r.json().catch(() => null);
  },
  /* 当前会话令牌；缺失时用本机保存的哈希静默换新令牌（不保存明文密码） */
  async sessionToken(){
    const s = AppAuth.current();
    if(!s) return '';
    if(s.token) return s.token;
    const users = Store.get('users', {});
    const rec = users[s.user] || null;
    if(!rec || !rec.hash) return '';
    try{
      const r = await this.rpc('sl_login_hash', { p_username: s.user, p_hash: rec.hash });
      if(r && r.ok && r.token){
        s.token = r.token;
        Store.set('session', s);
        return r.token;
      }
    }catch(e){}
    return '';
  },
  async loginRemote(u, p){ return this.rpc('sl_login', { p_username: u, p_password: p }); },
  async registerRemote(u, p){ return this.rpc('sl_register', { p_username: u, p_password: p }); },
  async _load(token){
    const r = await this.rpc('sl_load', { p_token: token });
    if(r && r.ok && r.data !== undefined && r.data !== null) return r.data;
    return null;
  },
  /* 读取云端数据 + 服务端时间戳（用于判断云端是否真的有更新） */
  async _loadMeta(token){
    const r = await this.rpc('sl_load', { p_token: token });
    if(!r || r.ok !== true) return null;
    return { data: (r.data === undefined ? null : r.data), updatedAt: Number(r.updated_at) || 0 };
  },
  async _save(token, data){
    const r = await this.rpc('sl_save', { p_token: token, p_data: data });
    if(!r || r.ok !== true) throw new Error('云端保存失败');
    this._hadRemote = true;
    if(r.updated_at) this._syncedAt = Number(r.updated_at) || this._syncedAt;
  },
  /* ---- 跨标签页「有未上传改动」标记 ----
     多个标签页共享 localStorage：若某一页还有没传上去的改动，
     其他页的 pullMerge 绝不能拿云端旧数据覆盖本机，否则改动会被静默吞掉。 */
  _pendingKey(){ const s = AppAuth.current(); return s ? ('sl.pending.' + s.user) : null; },
  _markPending(){
    try{ const k = this._pendingKey(); if(k) localStorage.setItem(k, String(Date.now())); }catch(e){}
  },
  _clearPending(){
    try{ const k = this._pendingKey(); if(k) localStorage.removeItem(k); }catch(e){}
  },
  hasPending(){
    if(this._dirty) return true;
    try{
      const k = this._pendingKey();
      if(!k) return false;
      const ts = parseInt(localStorage.getItem(k) || '0', 10) || 0;
      if(!ts) return false;
      // 超过 2 分钟的标记视为陈旧（持有它的标签页多半已关闭）
      if(Date.now() - ts > 120000){ localStorage.removeItem(k); return false; }
      return true;
    }catch(e){ return this._dirty; }
  },
  async loadData(){
    const t = await this.sessionToken();
    return t ? this._load(t) : null;
  },
  async saveData(data){
    const t = await this.sessionToken();
    if(!t) throw new Error('云端未登录');
    await this._save(t, data);
  },
  async deleteRemote(token, username){
    if(!token) return;
    try{
      const r = await this.rpc('sl_delete_account', { p_token: token, p_username: username });
      if(r && r.ok) this._hadRemote = false;
    }catch(e){}
  },
  /* ---- 自动同步泵：每个必要动作后串行上传；失败静默重试，持续失败才交给 Net 判定 ----
     ⚠️ 用「改动代数 _gen」而不是只看 _dirty：
     上传是异步的，飞行途中完全可能又发生新的改动。若成功分支无条件把 _dirty 置 false
     并清掉待同步标记，那次改动就被静默吞掉（本机有、云端没有，且界面显示「已同步」）。
     所以：上传前记下代数，成功后若代数变了，说明期间有新改动 → 保留 dirty/标记再传一轮。
     （这个窗口是复刻套件的自检脚本先发现的：learn() 触发的上传还在飞，
       紧接着的一次 save() 就被丢了。） */
  async _pump(){
    if(this._busy) return;
    this._busy = true;
    try{
      do{
        this._dirty = false;
        const gen = this._gen;
        const s = AppAuth.current();
        if(!s) break;
        try{
          await this.saveData(AppAuth.data());
          if(this._gen !== gen){
            // 上传期间又改了：这一轮的结果已经过时，保留下一次上传
            this._dirty = true;
            this._markPending();
            continue;
          }
          this._dirty = false;
          this._clearPending();
          this.lastOk = Date.now();
          this._syncUI();
          Net.markOk();
          if(this._retryTimer){ clearTimeout(this._retryTimer); this._retryTimer = null; }
        }catch(e){
          this.lastErr = Date.now();
          this._syncUI();
          // 在线优先：上传失败保留待同步标记（并跨标签页可见）并自动重试；
          // 是否弹全屏由 Net 按「持续时长 + 探测确认」决定（弱网抖动不拦）
          this._dirty = true;
          this._markPending();
          Net.onCloudFailure(e);
          if(!this._retryTimer) this._retryTimer = setTimeout(() => { this._retryTimer = null; this._pump(); }, 5000);
          break;
        }
      }while(this._dirty);
    }finally{
      this._busy = false;
    }
  },
  onDataChanged(){
    if(!this.active()) return;
    const s = AppAuth.current();
    if(!s) return;
    this._gen++;
    this._dirty = true;
    this._markPending();
    this._pump();
  },
  _syncUI(){
    try{
      // v2.7.16：每次「同步状态」刷新时顺手重画头像。
      // 之前头像只在登录首屏画一次，换设备登录时云端数据可能比首屏晚一步到位，
      // 于是侧栏一直显示首字母 —— 用户看到的就是「头像不能跨设备显示」。
      if(typeof AppProfile !== 'undefined' && AppProfile.paintAvatar) AppProfile.paintAvatar();
      const el = document.getElementById('sync-status');
      if(!el) return;
      const ok = this.lastOk || 0, err = this.lastErr || 0;
      if(ok >= err && ok){
        el.textContent = '已实时同步 · ' + new Date(ok).toLocaleTimeString();
      } else if(err > ok){
        el.textContent = '同步失败，将自动重试';
      } else {
        el.textContent = '自动实时上传中';
      }
    }catch(e){}
  },
  async flushKeepalive(){
    if(!this.active()) return;
    const s = AppAuth.current();
    if(!s) return;
    const t = s.token || await this.sessionToken();
    if(!t) return;
    try{
      await fetch(this.cfg.url + '/rest/v1/rpc/sl_save', {
        method: 'POST',
        headers: {
          'apikey': this.cfg.key,
          'Authorization': 'Bearer ' + this.cfg.key,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ p_token: t, p_data: AppAuth.data() }),
        keepalive: true
      });
      this._hadRemote = true;
    }catch(e){}
  },
  async pullMerge(){
    // 在线优先 v2.0.0：云端是唯一权威。
    // 但本页——或同一浏览器其它标签页——还有未上传的改动时，绝不能拿云端旧数据覆盖本机，
    // 否则网络抖动期间产生的改动会被静默吞掉（多标签页共享 localStorage，必现）。
    if(!this.active()) return;
    const s = AppAuth.current();
    if(!s) return;
    if(this._busy) return;
    if(this.hasPending()) return;
    try{
      const t = await this.sessionToken();
      if(!t) return;
      const meta = await this._loadMeta(t);
      if(!meta) return;
      const cloud = meta.data;
      if(!cloud || typeof cloud !== 'object' || !Object.keys(cloud).length) return;
      // 云端没有比我们已知的更新 → 不覆盖本机
      if(meta.updatedAt && this._syncedAt && meta.updatedAt <= this._syncedAt) return;
      const local = AppAuth.data();
      if(JSON.stringify(cloud) === JSON.stringify(local)){
        this._syncedAt = meta.updatedAt || this._syncedAt;
        return;
      }
      // 云端确实更新了：以云端覆盖本机缓存
      Store.set('u.'+s.user, cloud);
      if(meta.updatedAt) this._syncedAt = meta.updatedAt;
      const resetChange = (local.allResetAt || 0) !== (cloud.allResetAt || 0) ||
        (local.wordResetAt || 0) !== (cloud.wordResetAt || 0);
      const busy = false;   /* 框架：站点这里判断「学习会话进行中就先别刷界面」，业务已移除 */
      try{
        if(!document.hidden && typeof AppUI !== 'undefined'){
          if(resetChange && !busy){ AppUI.init(); }
          else if(!busy){ AppUI.init(); }   /* 框架：原本还要清词库缓存与筛选结果 */
        }
      }catch(e){}
    }catch(e){ Net.onCloudFailure(e); }
  }
};

/* 把底层网络错误转成用户能看懂的话（避免把 "Failed to fetch" 直接甩给用户） */

/* ── 来自站点 template.html 第 2513–2616 行：netErrText() + Net（连通性探测与全屏断网拦截层） ── */
function netErrText(e){
  const raw = (e && e.message) ? String(e.message) : String(e || '');
  if(/bad_token|未登录|无效令牌/i.test(raw)) return '登录状态已失效，请重新登录';
  if(/Failed to fetch|NetworkError|Load failed|net::|ERR_/i.test(raw)) return '无法连接云端服务器，请检查网络后重试';
  if(/timeout|timed out|超时/i.test(raw)) return '连接云端服务器超时，请检查网络后重试';
  return raw || '网络异常，请稍后重试';
}

/* ================= 在线优先 v2.0.0：联网状态与断网拦截 =================
   拦截门槛刻意做高，避免网络一抖就弹全屏：
   - 单次请求失败只算「疑似断网」：静默重试，不打扰用户；
   - 连续失败持续超过 GRACE_MS，且 sl_ping 探测确认确实连不上服务器，才拦截；
   - 期间只要有一次成功，立刻恢复并隐藏拦截层；
   - 令牌/会话失效不属于网络问题，单独提示重新登录。 */
const Net = {
  ok: true,
  GRACE_MS: 15000,      // 连续失败容忍期：短于此不拦
  _failingSince: 0,     // 首次失败时间（0 = 当前正常）
  _gateTimer: null,
  _lastProbe: 0,
  gateShown: false,

  async probe(force){
    const now = Date.now();
    if(!force && (now - this._lastProbe) < 3000) return this.ok;
    this._lastProbe = now;
    if(!Supa.active()){ this.ok = false; return false; }
    try{
      const r = await Supa.rpc('sl_ping', {});
      this.ok = !!(r && r.ok === true);
    }catch(e){ this.ok = false; }
    if(this.ok) this.markOk();
    return this.ok;
  },

  markOk(){
    this.ok = true;
    this._failingSince = 0;
    if(this._gateTimer){ clearTimeout(this._gateTimer); this._gateTimer = null; }
    this.hideGate();
  },

  /* 记录一次云端失败：是否升级为拦截由「持续时长 + 探测确认」决定 */
  onCloudFailure(err){
    const msg = (err && err.message) ? String(err.message) : '';
    if(/未登录|bad_token|token/i.test(msg)){
      this.showGate('登录状态已失效，请重新登录。', '退出并重新登录');
      return;
    }
    if(!this._failingSince) this._failingSince = Date.now();
    this.ok = false;
    this._scheduleConfirm();
  },

  _scheduleConfirm(){
    if(this._gateTimer) return;
    const waited = Date.now() - this._failingSince;
    this._gateTimer = setTimeout(async () => {
      this._gateTimer = null;
      if(!this._failingSince) return;                       // 期间已恢复
      if(Date.now() - this._failingSince < this.GRACE_MS) return this._scheduleConfirm();
      await this.probe(true);
      if(!this._failingSince || this.ok) return;            // 探测通了 → 已恢复
      this.showGate('已经连不上云端服务器，学习数据暂时无法读写。请检查网络，恢复后点「重试连接」。', '重试连接');
    }, Math.max(0, this.GRACE_MS - waited));
  },

  showGate(detail, label){
    const g = document.getElementById('net-gate');
    if(!g) return;
    const d = document.getElementById('net-gate-detail');
    if(d) d.textContent = detail ? String(detail).slice(0, 160) : '';
    const b = g.querySelector('button');
    if(b) b.textContent = label || '重试连接';
    g.hidden = false;
    this.gateShown = true;
  },
  hideGate(){
    const g = document.getElementById('net-gate');
    if(g) g.hidden = true;
    this.gateShown = false;
  },
  async retry(){
    const g = document.getElementById('net-gate');
    const btn = g && g.querySelector('button');
    if(btn){ btn.disabled = true; btn.textContent = '正在重试…'; }
    const ok = await this.probe(true);
    if(btn) btn.disabled = false;
    if(!ok){
      this.showGate('仍然连不上云端服务器，请检查网络后重试。', '重试连接');
      return;
    }
    this.markOk();
    if(AppAuth.current()){
      try{ await Supa.pullMerge(); AppUI.init(); }catch(e){}
      toast('已恢复连接');
    } else {
      AppAuth.showAuth();
    }
  }
};

function hashPW(pw, salt){
  let h = 5381; const s = salt + '::' + pw;
  for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))>>>0;
  return h.toString(16) + '.' + salt;
}
function genSalt(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

/* ── 来自站点 template.html 第 2885–2914 行：IDB（IndexedDB 缓存，自动备份用它） ── */
const IDB = {
  db: null, fail: false,
  open(){
    return new Promise((res, rej) => {
      try{
        const rq = indexedDB.open('studylens', 1);
        rq.onupgradeneeded = () => { const db = rq.result; if(!db.objectStoreNames.contains('lists')) db.createObjectStore('lists'); };
        rq.onsuccess = () => { this.db = rq.result; res(); };
        rq.onerror = () => { this.fail = true; rej(rq.error); };
      }catch(e){ this.fail = true; rej(e); }
    });
  },
  tx(mode){
    if(!this.db) throw new Error('IDB 未初始化');
    return this.db.transaction('lists', mode).objectStore('lists');
  },
  get(k){
    return new Promise(res => {
      try{ const rq = this.tx('readonly').get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); }
      catch(e){ res(null); }
    });
  },
  put(k, v){
    return new Promise(res => {
      try{ const rq = this.tx('readwrite').put(v, k); rq.onsuccess = () => res(true); rq.onerror = () => res(false); }
      catch(e){ res(false); }
    });
  }
};


/* ── 来自站点 template.html 第 3853–3974 行：Fit 自适应引擎 + fitNow + 防抖调度 ── */
/* ================= 自适应排版 =================
   v2.2：渲染后扫描带 data-fit 的元素，如果文字横向溢出、或被挤成「竖排」
   （每行只剩一两个字），就逐级缩小字号直到合适，从而在不同分辨率下都不破版。
   用法：<span data-fit>文字</span>（可选 data-fit-max="42" 指定起始上限、
        data-fit-nowrap 表示强制单行）。 */
const Fit = {
  MIN: 10,
  /* v2.7.7：自适应必须在元素「显示之前」算完。
     旧实现无条件补一帧再跑一遍，而那一遍往往才是真正缩到位的尺寸 ——
     于是用户看到「先按原始尺寸显示，一帧后再跳一下」，这就是切换屏幕时的顿感。
     现在：先强制一次布局结算让 clientWidth 立刻可量，只有确实量不到尺寸（例如容器还 hidden）
     时才补一帧。 */
  run(scope){
    const root = scope || document;
    const doIt = () => {
      let els;
      try{ els = root.querySelectorAll('[data-fit]'); }catch(e){ return 0; }
      let unsettled = 0;
      for(const el of els){
        try{ if(this.fitOne(el) === 'unsettled') unsettled++; }catch(e){}
      }
      return unsettled;
    };
    const holder = (root === document) ? document.documentElement : root;
    // 关掉适配期间的过渡：否则逐像素试缩会变成一串动画，量到的还是中间值
    try{ holder.classList.add('fitting'); }catch(e){}
    try{ void holder.offsetHeight; }catch(e){}          // 强制布局结算
    const unsettled = doIt();
    if(unsettled > 0){ try{ requestAnimationFrame(() => doIt()); }catch(e){} }
    try{ requestAnimationFrame(() => { try{ holder.classList.remove('fitting'); }catch(e){} }); }catch(e){}
    return unsettled;
  },
  fitOne(el){
    const cap = parseFloat(el.getAttribute('data-fit-max')) || 0;
    // v2.7.7：基准字号优先取「内联值 / 上一次缓存」，最后才回退 getComputedStyle ——
    // 字号现在带过渡，若上一轮过渡还在进行，computed 拿到的是动画中间值，会把基准记偏。
    let base = parseFloat(el.dataset.fitBase || '') || parseFloat(el.style.fontSize) || 0;
    if(!base){ base = parseFloat(getComputedStyle(el).fontSize) || 16; el.dataset.fitBase = String(base); }
    let size = Math.min(base, cap > 0 ? cap : base);
    let changed = false;
    /* v2.7.11（用户反馈：自适应一帧跳）：记下「用户当前看到的字号」。
       适配过程中会用 .fitting 关掉过渡（不然量到的是动画中间值，越算越偏），
       所以适配结果落地时是一帧硬跳 —— 这正是用户看到的「下一帧直接变了」。
       做法：算完之后用 Web Animations 从「原字号」补间到「最终字号」，
       元素本身直接写最终值，动画只负责让这一下看起来是滑过去的。 */
    const shownFs = parseFloat(getComputedStyle(el).fontSize) || base;
    const set = (v) => {                                 // 值没变就不写：无意义的样式写会引起整页重排
      const cur = parseFloat(el.style.fontSize);
      if(!(Math.abs(v - cur) < 0.01)){ el.style.fontSize = v + 'px'; changed = true; }
    };
    set(size);
    const nowrap = el.hasAttribute('data-fit-nowrap');
    for(let i = 0; i < 40 && size > this.MIN; i++){
      const r = this.ok(el, nowrap, size);        // 传入本轮目标字号，避免读到过渡中间值
      if(r === true) break;
      if(r === 'unsettled') return 'unsettled';
      size -= 1;
      set(size);
    }
    if(changed && Math.abs(shownFs - size) >= 0.5){
      try{
        el.animate([{ fontSize: shownFs + 'px' }, { fontSize: size + 'px' }],
                   { duration: 200, easing: 'cubic-bezier(.2,0,0,1)' });
      }catch(e){}
    }
    return changed ? 'fitted' : 'same';
  },
  ok(el, nowrap, curSize){
    // 用 Range 精确测量文字实际宽度（inline/flex 元素上 scrollWidth 不可靠）。
    // 可用宽度取「父容器」宽度：父容器已设 width:100%，不会随子元素缩放而抖动，
    // 否则会形成「越缩容器越窄」的反馈循环，一路缩到最小字号。
    const avail = (el.parentElement ? el.parentElement.clientWidth : 0) || el.clientWidth || 0;
    // 布局还没结算：不要据此缩小，明确回报给调用方（只有这种情况才值得补一帧）
    if(avail <= 0) return 'unsettled';

    // 高度模式（data-fit-h）：释义这类长文本块要能整块塞进固定高度的容器，
    // 优先「缩放压缩」，缩到最小仍放不下才交给容器内部滚动。
    if(el.hasAttribute('data-fit-h')){
      const host = el.parentElement || el;
      const hostH = host.clientHeight || 0;
      if(hostH > 0 && el.scrollHeight > hostH + 1) return false;
      // 宽度也要正常，避免缩到合适高度后仍然横向溢出
    }

    let textW = 0;
    try{
      const r = document.createRange();
      r.selectNodeContents(el);
      textW = r.getBoundingClientRect().width;
    }catch(e){ textW = el.scrollWidth; }
    if(nowrap){
      if(textW > avail + 1) return false;
      return el.scrollWidth <= avail + 2;
    }
    if(el.scrollWidth > avail + 2) return false;                // 横向溢出
    const text = (el.textContent || '').replace(/\s+/g, '');
    if(text.length < 4) return true;
    const fs = curSize || parseFloat(el.style.fontSize) || parseFloat(getComputedStyle(el).fontSize) || 16;
    const h = el.getBoundingClientRect().height;
    const lines = Math.max(1, Math.round(h / (fs * 1.2)));
    if(lines >= 2){
      // 每行平均不足 3 个字 → 已被挤成竖排，判定为不美观
      if(text.length / lines < 3) return false;
      // 出现「单字成行」的极端断行也不接受
      if(text.length / lines < 4 && lines >= 4) return false;
    }
    return true;
  }
};
