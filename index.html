function _rootZoom(){
  try{
    // v2.7.11：优先用内联目标值 —— 根缩放带过渡时 computed 是动画中间值，会把换算算偏
    const inline = parseFloat(document.documentElement.style.zoom);
    if(inline && inline > 0 && isFinite(inline)) return inline;
    const z = parseFloat(getComputedStyle(document.documentElement).zoom);
    return (z && z > 0 && isFinite(z)) ? z : 1;
  }catch(e){ return 1; }
}

function syncVpu(){
  const el = document.documentElement;
  if(!el) return;
  /* ⚠️ v2.7.11：根缩放现在带过渡，过渡途中 getComputedStyle 拿到的是「中间值」——
     用它算 --vpu 会把整页高度算成没缩放的高度（1440 宽下页面高 1035 而不是 900）。
     所以优先读**内联目标值**（applyScale 写进去的那个），读不到才回退 computed。 */
  let z = parseFloat(el.style.zoom) || 0;
  if(!z || !isFinite(z) || z <= 0){
    try{ const v = parseFloat(getComputedStyle(el).zoom); if(v && v > 0) z = v; }catch(e){}
  }
  if(!z || !isFinite(z) || z <= 0) z = 1;
  el.style.setProperty('--vpu', (window.innerHeight / z) + 'px');
}

/* ── 来自站点 template.html 第 6770–6896 行：AvatarCrop（微信式圆形头像裁剪） ── */
const AvatarCrop = {
  RING_RATIO: 0.84,        // 取景圆直径 / 舞台边长
  OUT: 192,                // 输出边长
  open(src){
    const mask = $('#avc-mask'), img = $('#avc-img'), stage = $('#avc-stage'), ring = $('#avc-ring');
    if(!mask || !img || !stage || !ring) return;
    this.mask = mask; this.img = img; this.stage = stage; this.ring = ring;
    this.tx = 0; this.ty = 0; this.zoom = 1; this.ok = false;
    const zr = $('#avc-zoom'); if(zr) zr.value = '100';
    const zv = $('#avc-zoom-val'); if(zv) zv.textContent = '100%';
    // 打开期间接管键盘：Esc 取消、Enter 确认；关闭时还原（不干扰学习页快捷键）
    this.prevKeys = document.onkeydown;
    document.onkeydown = e => {
      if(e.key === 'Escape'){ e.preventDefault(); this.close(); }
      else if(e.key === 'Enter'){ e.preventDefault(); this.confirm(); }
    };
    img.onload = () => {
      if(!img.naturalWidth || !img.naturalHeight){ toast('这张图片读不出来，请换一张', 'warn'); this.close(); return; }
      const side = stage.clientWidth || 320;
      const D = Math.round(side * this.RING_RATIO);
      this.D = D;
      ring.style.width = ring.style.height = D + 'px';
      ring.style.margin = (-D / 2) + 'px 0 0 ' + (-D / 2) + 'px';
      // 基准显示尺寸：图片刚好覆盖取景圆（cover），缩放系数 1 即此状态
      this.k = Math.max(D / img.naturalWidth, D / img.naturalHeight);
      this.bw = img.naturalWidth * this.k;
      this.bh = img.naturalHeight * this.k;
      img.style.width = this.bw + 'px';
      img.style.height = this.bh + 'px';
      this.apply();
    };
    img.onerror = () => { toast('这张图片读不出来，请换一张', 'warn'); this.close(); };
    img.src = src;
    mask.hidden = false;
    this.bind();
    const okBtn = $('#avc-ok');
    if(okBtn) setTimeout(() => okBtn.focus(), 30);
  },
  bind(){
    const st = this.stage;
    if(st._avcBound) return;                 // 只绑一次（舞台是常驻 DOM）
    st._avcBound = true;
    st.addEventListener('pointerdown', e => {
      if(this.mask.hidden) return;
      e.preventDefault();
      this.drag = { id: e.pointerId, x: e.clientX, y: e.clientY, tx: this.tx, ty: this.ty };
      if(st.setPointerCapture) try{ st.setPointerCapture(e.pointerId); }catch(err){}
      st.classList.add('drag');
    });
    st.addEventListener('pointermove', e => {
      if(!this.drag || this.drag.id !== e.pointerId) return;
      e.preventDefault();
      this.tx = this.drag.tx + (e.clientX - this.drag.x);
      this.ty = this.drag.ty + (e.clientY - this.drag.y);
      this.apply();
    });
    const end = e => {
      if(!this.drag || this.drag.id !== e.pointerId) return;
      this.drag = null;
      if(st.releasePointerCapture) try{ st.releasePointerCapture(e.pointerId); }catch(err){}
      st.classList.remove('drag');
    };
    st.addEventListener('pointerup', end);
    st.addEventListener('pointercancel', end);
    st.addEventListener('wheel', e => {
      if(this.mask.hidden) return;
      e.preventDefault();
      this.setZoom(this.zoom * (e.deltaY < 0 ? 1.09 : 0.917));
    }, { passive: false });
    const zr = $('#avc-zoom');
    if(zr) zr.oninput = () => this.setZoom(zr.value / 100);
    const c = $('#avc-cancel'); if(c) c.onclick = () => this.close();
    const o = $('#avc-ok'); if(o) o.onclick = () => this.confirm();
    // 点遮罩空白处 = 取消（点卡片内部不关闭）
    this.mask.addEventListener('click', e => { if(e.target === this.mask) this.close(); });
  },
  setZoom(z){
    this.zoom = clamp(z, 1, 3.2);
    const zr = $('#avc-zoom');
    if(zr) zr.value = String(Math.round(this.zoom * 100));
    const zv = $('#avc-zoom-val');
    if(zv) zv.textContent = Math.round(this.zoom * 100) + '%';
    this.apply();
  },
  /* 位移钳制：保证图片始终完整覆盖取景圆 */
  apply(){
    if(!this.bw) return;
    const z = this.zoom;
    const mx = Math.max(0, (this.bw * z - this.D) / 2);
    const my = Math.max(0, (this.bh * z - this.D) / 2);
    this.tx = clamp(this.tx, -mx, mx);
    this.ty = clamp(this.ty, -my, my);
    this.img.style.transform = 'translate(-50%,-50%) translate(' + this.tx + 'px,' + this.ty + 'px) scale(' + z + ')';
  },
  close(){
    if(!this.mask) return;
    this.mask.hidden = true;
    this.drag = null;
    document.onkeydown = this.prevKeys || null;
    if(this.img) this.img.removeAttribute('src');
  },
  confirm(){
    try{
      if(!this.bw || !this.D) return;
      const z = this.zoom, k = this.k, D = this.D;
      // 取景圆 -> 原图 source rect
      const sw = D / (k * z);
      const sx = ((this.bw * z - D) / 2 - this.tx) / (k * z);
      const sy = ((this.bh * z - D) / 2 - this.ty) / (k * z);
      const size = this.OUT;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';                     // 透明 PNG 垫白底，免得转 JPEG 后发黑
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(this.img, sx, sy, sw, sw, 0, 0, size, size);
      AppProfile.save({ avatar: c.toDataURL('image/jpeg', 0.72) }, true);  // v2.7.16：更低质量，控制体积
      AppProfile.paintAvatar();

      toast('头像已更新');
    }catch(e){
      toast('头像处理失败：' + (e.message || e), 'err');
      this.close();
    }
  }
};

 * --------------------------------------------------------------------------
 * 为什么需要：框架的账号与数据层是「云端唯一权威」（Supa + 7 个 RPC）。
 * 如果你还没建 Supabase，直接打开这个文件会卡在登录页 —— 所以这里提供一个
 * 与线上 RPC 完全同名、同返回结构的本地实现。注入 window.SiteDB.config 后
 * （部署器 tools/deploy-site.ps1 会做这件事）会**自动切回真云端**，本地实现不再介入。
 * ========================================================================== */
const LocalCloud = {
  enabled: false,
  KEY: 'fw.cloud',
  init(){
    let hasCloud = false;
    try{
      hasCloud = !!(window.SiteDB && window.SiteDB.config && window.SiteDB.config.url && window.SiteDB.config.key);
    }catch(e){ hasCloud = false; }
    this.enabled = !hasCloud;
    if(this.enabled) console.info('[framework] 未检测到 SiteDB 配置 → 使用本地后端（localStorage）。注入 Supabase 配置后自动切换为真云端。');
  },
  _db(){
    try{ return JSON.parse(localStorage.getItem(this.KEY) || '{}') || {}; }catch(e){ return {}; }
  },
  _flush(db){ try{ localStorage.setItem(this.KEY, JSON.stringify(db)); }catch(e){} },
  _acct(db, u){ db.accounts = db.accounts || {}; db.accounts[u] = db.accounts[u] || { user: u, data: null, updated_at: 0, token: '' }; return db.accounts[u]; },
  _rand(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); },
  _tok(db, u){ const a = this._acct(db, u); if(!a.token) a.token = 'local-' + this._rand(); return a.token; },
  _find(db, token){
    if(!token) return null;
    for(const u of Object.keys(db.accounts || {})) if(db.accounts[u].token === token) return db.accounts[u];
    return null;
  },
  async rpc(name, args){
    const a = args || {};
    const db = this._db();
    switch(name){
      case 'sl_ping': return { ok: true, local: true };
      case 'sl_register': {
        const u = String(a.p_username || '').trim(), p = String(a.p_password || '');
        if(!/^[\w\u4e00-\u9fa5]{2,20}$/.test(u)) return { ok: false, reason: 'bad_username' };
        if(p.length < 4) return { ok: false, reason: 'bad_password' };
        if((db.accounts || {})[u]) return { ok: false, reason: 'exists' };
        const salt = genSalt(), hash = hashPW(p, salt);
        const acc = this._acct(db, u);
        acc.salt = salt; acc.hash = hash; acc.token = 'local-' + this._rand(); acc.updated_at = now();
        this._flush(db);
        return { ok: true, token: acc.token, salt, hash };
      }
      case 'sl_login': {
        const u = String(a.p_username || '').trim(), p = String(a.p_password || '');
        const acc = (db.accounts || {})[u];
        if(!acc) return { ok: false, reason: 'nouser' };
        if(hashPW(p, acc.salt) !== acc.hash) return { ok: false, reason: 'badpass' };
        const token = this._tok(db, u); this._flush(db);
        return { ok: true, token, salt: acc.salt, hash: acc.hash };
      }
      case 'sl_login_hash': {
        const u = String(a.p_username || '').trim();
        const acc = (db.accounts || {})[u];
        if(!acc || acc.hash !== a.p_hash) return { ok: false, reason: 'nouser' };
        const token = this._tok(db, u); this._flush(db);
        return { ok: true, token };
      }
      case 'sl_load': {
        const acc = this._find(db, a.p_token);
        if(!acc) return { ok: false, reason: 'badtoken' };
        return { ok: true, data: acc.data, updated_at: acc.updated_at || 0 };
      }
      case 'sl_save': {
        const acc = this._find(db, a.p_token);
        if(!acc) return { ok: false, reason: 'badtoken' };
        acc.data = a.p_data || null;
        acc.updated_at = now();
        this._flush(db);
        return { ok: true, updated_at: acc.updated_at };
      }
      case 'sl_delete_account': {
        const acc = this._find(db, a.p_token);
        if(acc) delete db.accounts[acc.user];
        this._flush(db);
        return { ok: true };
      }
      default: return { ok: false, reason: 'unknown_rpc' };
    }
  }
};
LocalCloud.init();
(function patchSupa(){
  const realActive = Supa.active.bind(Supa);
  const realRpc = Supa.rpc.bind(Supa);
  Supa.active = function(){ return realActive() || LocalCloud.enabled; };
  Supa.rpc = function(name, args){ return realActive() ? realRpc(name, args) : LocalCloud.rpc(name, args); };
})();

/* ==========================================================================
 * 0b. 账号文档的默认结构（覆盖站点遗留的那一份）
 * --------------------------------------------------------------------------
 * 站点版的 defaultData() 里全是英语学习字段（wordState / filter.cet4 / studyMode…）。
 * 框架换成通用结构：settings（偏好）+ profile（资料）+ items（示例内容）+ stats + meta。
 * 你要加字段就加在这里 —— 每个字段都应当是**可选**的（老账号读出来是 undefined，用 ?? 兜底）。
 * ==========================================================================*/
AppAuth.defaultData = function(){
  const deployed = typeof location !== 'undefined' && location.protocol === 'https:';
  return {
    settings: {
      theme: 'auto',          // light | dark | auto
      accent: 'graphite',     // 见 ACCENTS
      uiScale: 100,           // 手动缩放百分比
      autoScale: true,        // 是否按窗口宽度自动缩放
      onboarded: false,       // 首启引导是否看过
      demoSwitch: false       // 示例开关（内容页那个）
    },
    profile: { nick: '', bio: '', email: '', avatar: '' },
    items: [],                                        // 示例内容：内容页「加一条内容」写这里
    stats: { created: now(), totalOps: 0, lastOpDay: '', dayLog: {} },
    meta: { updated: 0 },
    cloud: { enabled: deployed, lastSync: 0 }
  };
};

/* ==========================================================================
 * 1. 组件助手：把内容塞进框架视觉语言的最小工具集
 * --------------------------------------------------------------------------
 * 这些函数只生成字符串（不碰 DOM），风格与框架 CSS 完全一致；
 * 你在 PAGES.xxx.render() 里拼 HTML 时直接用它们。
 * ==========================================================================*/
const UI = {
  /** 卡片：card('标题', '正文 HTML', {icon:'file', right:'...', cls:'', flat:false}) */
  card(title, body, opts){
    const o = opts || {};
    return '<div class="card' + (o.cls ? ' ' + o.cls : '') + '"' + (o.style ? ' style="' + o.style + '"' : '') + '>' +
      (title ? '<div class="card-title">' +
        (o.icon ? '<span class="ico" data-icon="' + o.icon + '"></span>' : '<span class="dot"></span>') +
        esc(title) + (o.right || '') + '</div>' : '') +
      (body || '') + '</div>';
  },
  /** 一行「标签 — 值」，用在设置页/详情页 */
  kv(label, value){
    return '<div class="kv"><span class="kk">' + label + '</span><span class="vv">' + value + '</span></div>';
  },
  /** 无界并列数字行：statRow([[值, 标签], ...]) —— 无边框，靠一条两端透明的渐变线分隔 */
  statRow(items){
    return '<div class="statrow">' + items.map(([v, l]) =>
      '<div class="sr-item"><b>' + esc(String(v)) + '</b><span>' + esc(String(l)) + '</span></div>').join('') + '</div>';
  },
  /** 开关行：switchRow('标签', 'id', checked) —— 与设置页同一套 language */
  switchRow(label, id, checked){
    return '<div class="kv"><span class="kk">' + label + '</span><span class="vv">' +
      '<label class="switch"><input type="checkbox" id="' + id + '"' + (checked ? ' checked' : '') + '><span class="sl"></span></label>' +
      '</span></div>';
  },
  /** 流带（框架的主行动元素）：flowBand({main, sub, icon, onclick, cls, max}) */
  flowBand(o){
    const op = o || {};
    return '<button class="flow-band' + (op.cls ? ' ' + op.cls : '') + '" type="button"' +
      (op.max ? ' data-max="' + op.max + '"' : '') +
      (op.onclick ? ' onclick="' + op.onclick + '"' : '') +
      ' aria-label="' + esc(op.main + (op.sub ? '，' + op.sub : '')) + '">' +
      (op.compact
        ? '<span class="fb-txt"><span class="fb-main">' + esc(op.main) + '</span>' +
          (op.sub ? '<span class="fb-sub">' + esc(op.sub) + '</span>' : '') + '</span>'
        : '<span class="fb-txt">' + (op.icon ? '<span class="fb-ic" data-icon="' + op.icon + '"></span>' : '') +
          '<span class="fb-main">' + esc(op.main) + '</span>' +
          (op.sub ? '<span class="fb-sub">' + esc(op.sub) + '</span>' : '') + '</span>') +
      '<span class="fb-arrows" aria-hidden="true">' +
      '<span class="arw" data-icon="chevRight"></span><span class="arw" data-icon="chevRight"></span><span class="arw" data-icon="chevRight"></span>' +
      '</span></button>';
  },
  /** 一排标签 */
  tags(list){
    return '<div class="row" style="flex-wrap:wrap;gap:6px">' +
      list.map(t => '<span class="tag">' + esc(String(t)) + '</span>').join('') + '</div>';
  },
  /** 空状态 */
  empty(text){ return '<div class="empty"><div class="empty-t">' + esc(text) + '</div></div>'; },
  /** 主行动条（概览顶栏那条会呼吸的大条）：heroBand({main, sub, onclick}) */
  heroBand(o){
    const op = o || {};
    return '<button class="flow-band compact" type="button" onclick="' + op.onclick + '" aria-label="' + esc(op.main) + '">' +
      '<span class="fb-txt"><span class="fb-main">' + esc(op.main) + '</span>' +
      (op.sub ? '<span class="fb-sub">' + esc(op.sub) + '</span>' : '') + '</span>' +
      '<span class="fb-arrows" aria-hidden="true"><span class="arw" data-icon="chevRight"></span>' +
      '<span class="arw" data-icon="chevRight"></span><span class="arw" data-icon="chevRight"></span></span></button>';
  }
};

    render(){

        '<div class="topbar"><div><h1>内容页</h1>' +
        '<div class="sub">这一页演示框架提供的全部组件，也是你填自己内容的模板</div></div></div>' +
        UI.card('组件一览',
          '<div class="row" style="flex-wrap:wrap;gap:8px">' +
            '<button class="btn btn-sm btn-primary" onclick="AppDemo.addItem()">加一条内容</button>' +
            '<button class="btn btn-sm" onclick="CountSheet.open({max:20,label:\'选择数量\',onPick:n=>toast(\'你选了 \'+n)})">下滑式数量窗</button>' +
            '<button class="btn btn-sm" onclick="AppDemo.modal()">弹层</button>' +

/* 内容页的那几个按钮要做的事（示例业务逻辑，可整段删掉换成你自己的） */
const AppDemo = {
  addItem(){
    const d = AppAuth.data();
    d.items = d.items || [];
    d.items.push({ title: '条目 ' + (d.items.length + 1), note: new Date().toLocaleTimeString() });
    AppAuth.save(d);
    toast('已加一条并上传云端');
    AppUI.rerender();
  },
  remove(i){
    const d = AppAuth.data();
    d.items.splice(i, 1);
    AppAuth.save(d);
    AppUI.rerender();
  },
  clear(){
    const d = AppAuth.data();
    d.items = [];
    AppAuth.save(d);
    toast('已清空', 'warn');
    AppUI.rerender();
  },
  modal(){
    openModal('<h3 style="margin-bottom:10px">这是一个弹层</h3>' +
      '<p class="muted" style="line-height:1.8">用 <code>openModal(html)</code> 打开、<code>AppUI.closeModal()</code> 关闭；' +
      '点遮罩也会关。内容随你写。</p>' +
      '<div style="margin-top:20px;text-align:right"><button class="btn btn-primary" onclick="AppUI.closeModal()">知道了</button></div>');
  },
  theme(){
    const keys = Object.keys(ACCENTS);
    const d = AppAuth.data();
    const i = keys.indexOf(d.settings.accent);
    d.settings.accent = keys[(i + 1) % keys.length];
    AppAuth.save(d);
    applyTheme();
    toast('主题色：' + ACCENTS[d.settings.accent]);
  }
};

/* ==========================================================================
 * 3. 外壳与导航：AppUI
 * --------------------------------------------------------------------------
 * 与真实站点用的是同一套迁移原语（slideLayers / layerDir），
 * 页面切换、设置两级切换、流带加速都是「旧的下去、新的上来」。
 * ==========================================================================*/
const AppUI = {
  page: 'dashboard',
  _switching: false,
  _flowing: false,

  /* ---- 首启：按 PAGES 生成导航（你加页面时不用手写按钮） ----
     nav: true  → 侧栏 + 底栏都出现
     nav: 'bottom' → 只出现在手机底栏（桌面端走侧栏底部的用户中心入口）
     nav: false / 不写 → 不进导航，只能被 go() 跳过去（详情页之类） */
  buildNav(){
    const sideItems = Object.keys(PAGES).filter(k => PAGES[k].nav === true);
    const bottomItems = Object.keys(PAGES).filter(k => PAGES[k].nav === true || PAGES[k].nav === 'bottom');
    const navHtml = sideItems.map(k => {
      const nm = PAGES[k].label.split('|');   // 「侧栏文字|底栏文字」可选
      return '<button class="nav-btn' + (k === this.page ? ' active' : '') + '" data-page="' + k + '" ' +
        'onclick="AppUI.go(\'' + k + '\')"><span class="ico" data-icon="' + PAGES[k].icon + '"></span>' + esc(nm[0]) + '</button>';
    }).join('');
    const side = document.getElementById('side-nav');
    if(side){
      const user = side.querySelector('.side-user');
      side.innerHTML = navHtml + '<div class="nav-sep"></div>';
      if(user) side.appendChild(user);
    }
    const bn = document.getElementById('bottom-nav');
    if(bn){
      bn.innerHTML = bottomItems.map(k => {
        const nm = PAGES[k].label.split('|');
        return '<button class="bnav-btn' + (k === this.page ? ' active' : '') + '" data-page="' + k + '" ' +
          'onclick="AppUI.go(\'' + k + '\')"><span class="ico" data-icon="' + PAGES[k].icon + '"></span>' + esc(nm[1] || nm[0]) + '</button>';
      }).join('');
    }
    this.decorate();
  },

  /* ---- 侧栏折叠（ChatGPT 样式）：状态挂在 <html> 上 + 只存本机 ---- */
  sideCollapsed(){ return document.documentElement.classList.contains('side-collapsed'); },
  applySide(){
    const on = this.sideCollapsed();
    const b = $('#side-toggle');
    if(b){
      b.setAttribute('aria-expanded', on ? 'false' : 'true');
      b.setAttribute('aria-label', on ? '展开侧边栏' : '收起侧边栏');
    }
    /* 侧栏宽度与主区 padding 都有过渡（300ms）—— 任何依赖宽度的复核都要等过渡走完再做，
       否则量到的是中途值（真实站点就在这里踩过「卡片被压到 300px」）。 */
    try{
      if(typeof syncVpu === 'function') syncVpu();
      clearTimeout(window.__sideFitT);
      window.__sideFitT = setTimeout(() => {
        try{ fitNow(document); }catch(e){}
        try{ if(typeof fitPanelHeight === 'function') fitPanelHeight(); }catch(e){}
      }, 360);
    }catch(e){}
  },
  toggleSide(force){
    const next = (typeof force === 'boolean') ? force : !this.sideCollapsed();
    document.documentElement.classList.toggle('side-collapsed', next);
    try{ Store.set('sideCollapsed', next); }catch(e){}
    this.applySide();
    return next;
  },

  /* ---- 静态装饰：把 data-icon 变成真图标 ---- */
  decorate(){
    $$('[data-icon]').forEach(b => {
      if(!b.querySelector('.ico-svg')) b.insertAdjacentHTML('afterbegin', icon(b.dataset.icon, 15));
    });
  },
  closeModal(){ $('#modal-root').innerHTML = ''; },

  /* ---- 页面切换：旧的下去、新的上来（与真实站点同一套 slideLayers） ---- */
  go(page, fromHash, opts){
    const o = opts || {};
    const meta = PAGES[page];
    if(!meta) return;
    const prev = document.querySelector('#main-area > section:not([hidden])');
    const targetEl = document.getElementById('page-' + page);
    if(!targetEl) return;
    const canSlide = !o.noSlide && prev && prev !== targetEl &&
                     prev.parentElement === targetEl.parentElement && !this._switching;
    this.page = page;
    clearBandGo();                                   // 清掉流带加速态残留（踩过的坑）
    document.onkeydown = null;
    $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    $$('.bnav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    const su = $('#side-user-btn'); if(su) su.classList.toggle('active', page === 'profile');
    Object.keys(PAGES).forEach(p => {
      const el = document.getElementById('page-' + p);
      if(!el) return;
      el.hidden = p !== page;
      el.removeAttribute('data-no-in');               // 普通切页保留 pageIn 入场动画
    });
    if(meta.render) meta.render();
    if(page === 'profile') AppProfile.render();
    this.decorate();
    syncCornerNote();
    syncFrameworkUI();
    if(canSlide){
      prev.setAttribute('data-no-in', '');           // 放回旧页前先关掉入场动画，免得重播出现空档
      prev.hidden = false;
      this._switching = true;
      const clear = () => { this._switching = false; };
      setTimeout(clear, 1000);                       // 兜底，别把后续切换永久锁死
      slideLayers(targetEl.parentElement, prev, targetEl, layerDir(!o.back), clear, { keepCur: true });
    }
    window.scrollTo({ top: 0 });
    if(!fromHash){
      try{
        const t = '#/' + page;
        if(history.pushState && location.hash !== t) history.pushState(null, '', t);
      }catch(e){}
    }
  },
  /** 重新渲染当前页（内容变了但不想做动画时用） */
  rerender(){ const m = PAGES[this.page]; if(m && m.render) m.render(); this.decorate(); },

  /* ---- 流带点击：先加速，把目标页渲染好，再整页平移过去 ---- */
  flowTo(el, page, tab){ this.startFlowTo(el, page, tab); },
  startFlowTo(el, page, tab){
    if(this._flowing) return;
    this._flowing = true;
    if(el && el.classList) el.classList.add('go');
    let target = null;
    setTimeout(() => { try{ target = this.preRenderPage(page, tab); }catch(e){} }, 80);   // 加速窗口内完成渲染
    setTimeout(() => {
      this._flowing = false;
      clearBandGo();
      this.goFlow(page, layerDir(true), tab, target);
    }, 220);
  },
  /** 渲染但不显示（用户看不见的那一帧里把下一屏准备好） */
  preRenderPage(page, tab){
    const cur = document.querySelector('#main-area > section:not([hidden])');
    const target = document.getElementById('page-' + page);
    if(!target || cur === target) return null;
    const curHidden = cur ? cur.hidden : true;
    this.go(page, false, { noSlide: true });
    target.hidden = true;
    if(cur){ cur.setAttribute('data-no-in', ''); cur.hidden = curHidden; }
    return target;
  },
  goFlow(page, dir, tab, preRendered){
    const cur = document.querySelector('#main-area > section:not([hidden])');
    const target = preRendered || document.getElementById('page-' + page);
    if(!target) return;
    if(!preRendered) this.go(page, false, { noSlide: true });
    else target.hidden = false;
    if(!cur || cur === target || !target.parentElement) return;
    cur.setAttribute('data-no-in', '');
    cur.hidden = false;
    slideLayers(target.parentElement, cur, target, dir || layerDir(true), null, { keepCur: true });
  },

  /* ---- 启动：先把外壳「藏起来但照常排版」地算完，再一次性显示 ---- */
  init(){
    try{
      const h = (location.hash || '').replace(/^#\/?/, '');
      if(PAGES[h]) this.page = h;
    }catch(e){}
    const s = AppAuth.current();
    if(!s){ AppAuth.showAuth(); return; }
    $('#view-auth').hidden = true;
    const shell = $('#view-main');
    shell.hidden = false;
    const had = shell.style.visibility;
    shell.style.visibility = 'hidden';               // 量得到尺寸，但用户看不见
    this.buildNav();
    this.applySide();
    applyTheme();
    applyScale();
    $('#side-avatar').textContent = (AppAuth.displayLabel()[0] || '?').toUpperCase();
    $('#side-name').textContent = AppAuth.displayLabel();
    $('#side-role').textContent = '用户中心';
    $('#set-user').textContent = AppAuth.displayName();
    AppProfile.paintAvatar();
    applyPrefsToUI();
    try{ this.go(this.page); }catch(e){ showFatal(e && e.message ? e.message : String(e)); }
    fitNow(document);
    void shell.offsetHeight;                         // 强制结算，把上面所有改动一次落到布局
    shell.style.visibility = had || '';
    document.documentElement.classList.add('zoom-anim');   // 之后改缩放都是平滑过渡
    Onboarding.maybe();
  }
};

/* ---- 右下角小字入口（框架组件）：跟着它所属的面板显隐 ---- */
function syncCornerNote(){
  const note = document.getElementById('fw-corner-note');
  if(!note) return;
  const pane = document.getElementById('set-pane-about');
  const settings = document.getElementById('page-settings');
  const shell = document.getElementById('view-main');
  note.hidden = !(shell && !shell.hidden && settings && !settings.hidden && pane && !pane.hidden);
}

/* ---- 把「后端是谁」「最近备份」这类状态写进界面（切页时顺手刷一次） ---- */
function syncFrameworkUI(){
  const backend = LocalCloud.enabled ? '本地后端（localStorage）' : 'Supabase（RPC）';
  const b1 = document.getElementById('prof-backend'), b2 = document.getElementById('about-backend');
  if(b1) b1.textContent = backend;
  if(b2) b2.textContent = backend;
  const m = AppData.backupMeta();
  const ab = document.getElementById('auto-back-info');
  if(ab) ab.textContent = m ? (fmtDate(m.ts) + ' ' + new Date(m.ts).toLocaleTimeString()) : '尚无（完成一次操作后自动生成）';
  const cb = document.getElementById('cloud-badge');
  if(cb) cb.textContent = LocalCloud.enabled ? '当前使用本地后端（未接入 Supabase）' : ('已接入云端：' + (Supa.cfg ? Supa.cfg.url.replace(/^https?:\/\//, '').split('.')[0] : '—'));
}

/* ==========================================================================
 * 4. 设置：索引一屏 + 内容一屏（真实站点 v2.7.17 的同一套结构）
 * --------------------------------------------------------------------------
 * 加一个设置大类 = 在 shell HTML 的 #set-index 里加一张 .set-card，
 * 再在 #set-panes 里加一个 <section class="set-pane" data-pane="xxx">。
 * ==========================================================================*/
const AppSettings = {
  catName: null,
  _keepCat: false,
  _keepVisible: false,      // ⚠️ 平移期间冻结显隐：退场层一旦被 display:none，动效就退化成瞬移
  _keepPane: null,
  CAT_NAMES: { account: '账户', prefs: '偏好', appearance: '外观', data: '数据', about: '关于' },

  applyVis(){
    const cat = this.catName || '';
    const indexEl = document.getElementById('set-index');
    const panesEl = document.getElementById('set-panes');
    if(indexEl) indexEl.hidden = !!cat;
    if(panesEl) panesEl.hidden = !cat;
    $$('.set-pane').forEach(p => { p.hidden = p.dataset.pane !== cat; });
  },
  renderPanes(){
    const crumb = document.getElementById('set-crumb');
    if(crumb) crumb.textContent = this.CAT_NAMES[this.catName] || '';
    $$('.set-cat').forEach(b => b.classList.toggle('active', b.dataset.cat === this.catName));
  },
  cat(name){
    const views = document.getElementById('set-views');
    const index = document.getElementById('set-index');
    const panes = document.getElementById('set-panes');
    if(!views || !index || !panes || !name || name === this.catName) return;
    const fromIndex = !index.hidden;
    this.catName = name;
    this.renderPanes();
    if(fromIndex){
      this._keepVisible = true;                        // 两层都保持可见
      index.hidden = false;
      panes.hidden = false;
      $$('.set-pane').forEach(p => { p.hidden = p.dataset.pane !== name; p.setAttribute('data-no-in', ''); });
      index.setAttribute('data-no-in', '');
      slideLayers(views, index, panes, layerDir(true), () => this.applyVis(), { keepCur: true });
    } else {
      this.applyVis();
    }
  },
  back(){
    const views = document.getElementById('set-views');
    const index = document.getElementById('set-index');
    const panes = document.getElementById('set-panes');
    if(!views || !index || !panes) return;
    if(!index.hidden && panes.hidden) return;          // 已经在索引页
    const cur = Array.prototype.find.call(panes.children, el => el.classList.contains('set-pane') && !el.hidden);
    this.catName = null;
    this.renderPanes();
    if(!cur){ this.applyVis(); return; }
    index.hidden = false;
    panes.hidden = false;
    cur.setAttribute('data-no-in', '');
    index.setAttribute('data-no-in', '');
    slideLayers(views, panes, index, layerDir(false), () => this.applyVis(), { keepCur: true });
  },
  /* ---- 数据与备份 ---- */
  exportData(){ AppData.export(); },
  cornerDemo(){ toast('右下角那条小字只在「关于」面板里出现 —— 现在它就在屏幕右下角'); },
  importData(){ const f = document.getElementById('import-file'); if(f) f.click(); },
  onImport(ev){
    const file = ev.target.files && ev.target.files[0];
    if(file) AppData.import(file);
    ev.target.value = '';
  },
  resetAll(){
    if(prompt('将恢复出厂设置（清空本账号的全部内容与偏好）。输入「重置」确认：') !== '重置'){ toast('已取消', 'warn'); return; }
    const s = AppAuth.current();
    if(!s) return;
    const data = AppAuth.defaultData();
    Store.set('u.' + s.user, data);
    AppAuth.save(data);
    toast('已恢复默认');
    AppUI.init();
  },
  deleteAccount(){
    const s = AppAuth.current();
    if(!s) return;
    if(prompt('将永久删除账号「' + s.user + '」及其全部数据。输入账号名确认：') !== s.user){ toast('已取消', 'warn'); return; }
    (async () => {
      try{
        const t = await Supa.sessionToken();
        await Supa.deleteRemote(t, s.user);
      }catch(e){}
      try{ Store.remove('u.' + s.user); Store.remove('session'); }catch(e){}
      toast('账号已删除');
      location.reload();
    })();
  }
};

/* ---- 偏好的读入 / 写出（真实站点「改动即保存、无保存按钮」的同一套做法） ---- */
function applyPrefsToUI(){
  const st = AppAuth.data().settings;
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.value = v; };
  const chk = (id, v) => { const el = document.getElementById(id); if(el) el.checked = !!v; };
  set('set-theme', st.theme || 'auto');
  chk('set-autoscale', st.autoScale !== false);
  syncScaleUI();
  applyTheme();
}
function bindPrefs(){
  const save = (fn) => { const d = AppAuth.data(); fn(d); AppAuth.save(d); };
  const on = (id, ev, handler) => { const el = document.getElementById(id); if(el) el.addEventListener(ev, handler); };
  on('set-theme', 'change', e => { save(d => { d.settings.theme = e.target.value; }); applyTheme(); });
  on('set-autoscale', 'change', e => {
    save(d => { d.settings.autoScale = !!e.target.checked; });
    if(e.target.checked) applyScale(); else applyScale(parseInt(AppAuth.data().settings.uiScale, 10) || 100);
    syncScaleUI();
  });
  const sc = document.getElementById('set-scale'), scv = document.getElementById('set-scale-val');
  if(sc){
    /* 拖动只预览、松开才应用（真实站点 v2.6.0 的做法：拖一格不重排、不写云端） */
    sc.addEventListener('input', () => { if(scv) scv.textContent = sc.value + '%'; });
    sc.addEventListener('change', () => {
      save(d => { d.settings.uiScale = parseInt(sc.value, 10) || 100; d.settings.autoScale = false; });
      const ac = document.getElementById('set-autoscale'); if(ac) ac.checked = false;
      applyScale(parseInt(sc.value, 10));
      toast('界面缩放 ' + sc.value + '%');
    });
  }
  on('import-file', 'change', e => AppSettings.onImport(e));
}

/* ==========================================================================
 * 5. 用户中心：头像（微信式圆形裁剪）+ 资料 + 数据
 * ==========================================================================*/
const AppProfile = {
  pickAvatar(){ const f = document.getElementById('prof-avatar-file'); if(f) f.click(); },
  onAvatarFile(input){
    const file = input.files && input.files[0];
    if(!file) return;
    const rd = new FileReader();
    rd.onload = () => AvatarCrop.open(rd.result, dataUrl => {
      AppAuth.saveProfile({ avatar: dataUrl });
      this.paintAvatar();
      toast('头像已更新（随账号同步到云端）');
    });
    rd.readAsDataURL(file);
    input.value = '';
  },
  clearAvatar(){
    AppAuth.saveProfile({ avatar: '' });
    this.paintAvatar();
    toast('已恢复默认头像');
  },
  paintAvatar(){
    const p = AppAuth.profile();
    const letter = (AppAuth.displayLabel()[0] || '?').toUpperCase();
    [['#prof-avatar', 1], ['#side-avatar', 0]].forEach(([sel]) => {
      const el = document.querySelector(sel);
      if(!el) return;
      if(p.avatar){
        el.innerHTML = '<img alt="" src="' + p.avatar + '">';
      } else {
        el.textContent = letter;
      }
    });
  },
  render(){
    const s = AppAuth.current();
    const d = AppAuth.data();
    const el = document.getElementById('prof-user');
    if(el) el.textContent = s ? s.user : '—';
    const box = document.getElementById('prof-stats');
    if(box){
      const bytes = new Blob([JSON.stringify(d)]).size;
      box.innerHTML = [
        ['内容条目', (d.items || []).length],
        ['数据大小', (bytes / 1024).toFixed(1) + ' KB'],
        ['存于', LocalCloud.enabled ? '本机' : '云端'],
        ['最近更新', d.meta && d.meta.updated ? new Date(d.meta.updated).toLocaleString() : '—']
      ].map(([l, v]) => UI.card('', '<div class="stat"><b style="font-size:20px">' + esc(String(v)) + '</b><span>' + esc(l) + '</span></div>')).join('');
    }
    const back = document.getElementById('prof-backend');
    if(back) back.textContent = LocalCloud.enabled ? '本地后端（localStorage）' : 'Supabase（RPC）';
    this.paintAvatar();
  }
};

/* ==========================================================================
 * 6. 首启引导（框架版：三步说明，用弹层实现，不依赖额外 CSS）
 * ==========================================================================*/
const Onboarding = {
  maybe(){
    const d = AppAuth.data();
    if(d.settings.onboarded) return;
    setTimeout(() => this.open(), 350);
  },
  open(){
    const d = AppAuth.data();
    d.settings.onboarded = true;
    AppAuth.save(d);
    openModal(
      '<h3 style="margin-bottom:12px">欢迎使用这个前端框架</h3>' +
      '<p class="muted" style="line-height:1.9">' +
      '· 左侧是导航，页面的增删改都在 <code>PAGES</code> 这张表里；<br>' +
      '· 所有切换都是「旧的下去、新的上来」的平滑迁移，不需要你写动画；<br>' +
      '· 主题、强调色、界面缩放、账号、云同步、导出备份都已经接好，改内容时不用碰它们。</p>' +
      '<p class="muted" style="line-height:1.9;margin-top:10px">填内容的完整步骤见同目录的《03-Agent 使用指南.md》。</p>' +
      '<div style="margin-top:20px;text-align:right"><button class="btn btn-primary" onclick="AppUI.closeModal()">开始</button></div>');
  }
};

/* ==========================================================================
 * 7. 启动序列（顺序很重要，别随意调）
 * ==========================================================================*/
window.addEventListener('hashchange', () => {
  const h = (location.hash || '').replace(/^#\/?/, '');
  if(PAGES[h] && h !== AppUI.page) AppUI.go(h, true);
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') AppUI.closeModal();
  if((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')){
    const t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    AppUI.toggleSide();
  }
});
(function boot(){
  try{
    Supa.init();
    bindPrefs();
    const st = document.getElementById('side-toggle');
    if(st) st.addEventListener('click', () => AppUI.toggleSide());
    const acctBtn = document.getElementById('set-logout');
    if(acctBtn) acctBtn.addEventListener('click', () => AppAuth.logout());
    if(AppAuth.current()) AppUI.init(); else AppAuth.showAuth();
  }catch(e){ showFatal(e && e.message ? e.message : String(e)); }
})();


</script>

<script>

(function () {
