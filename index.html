  var ADMIN_PBKDF2_ITER_FALLBACK = 20000;
  var ADMIN_PBKDF2_HASH_FALLBACK = "b505d6857d1467a73a713c867114b086c77b9be34fb7705c930a009dbcf3c0a0";
  var ADMIN_HASH = "52c3771e53f78ee1b36b7578856f243f7b82362f5506bc2d79ca656f4dea9b62";

  var CLASS_NAME = "2026级公共管理类本科2班";
  var CATEGORIES = {
    income: ["班费缴纳", "学校拨款", "活动结余", "其他收入"],
    expense: ["聚餐活动", "春游出行", "学习用品", "班级福利", "演出道具", "其他支出"]
  };

  /* ---------------- 小工具 ---------------- */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function uid() { return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function fmt(n) {
    return Number(n).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function iconChar(c) {
    var m = { "班费缴纳": "缴", "学校拨款": "拨", "活动结余": "余", "其他收入": "入",
              "聚餐活动": "餐", "春游出行": "游", "学习用品": "学", "班级福利": "福",
              "演出道具": "演", "其他支出": "出" };
    return m[c] || "费";
  }

  /* ---------------- SHA-256 / HMAC / PBKDF2 ---------------- */
  function sha256Bytes(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var m = Math.pow, max = m(2, 32), L = "length", i, j, r = "", w = [];
    var bits = ascii[L] * 8, h = sha256Bytes.h = sha256Bytes.h || [], k = sha256Bytes.k = sha256Bytes.k || [];
    var pc = k[L], comp = {};
    for (var cand = 2; pc < 64; cand++) {
      if (!comp[cand]) { for (i = 0; i < 313; i += cand) comp[i] = cand;
        h[pc] = (m(cand, .5) * max) | 0; k[pc++] = (m(cand, 1 / 3) * max) | 0; }
    }
    ascii += "\x80";
    while (ascii[L] % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii[L]; i++) { j = ascii.charCodeAt(i); if (j >> 8) return; w[i >> 2] |= j << ((3 - i) % 4) * 8; }
    w[w[L]] = (bits / max) | 0; w[w[L]] = bits;
    for (j = 0; j < w[L];) {
      var x = w.slice(j, j += 16), old = h; h = h.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = x[i - 15], w2 = x[i - 2], a = h[0], e = h[4];
        var t1 = h[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & h[5]) ^ ((~e) & h[6])) + k[i] +
          (x[i] = (i < 16) ? x[i] : (x[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + x[i - 7] +
            (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
        h = [(t1 + t2) | 0].concat(h); h[4] = (h[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) h[i] = (h[i] + old[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (h[i] >> (j * 8)) & 255; r += ((b < 16) ? 0 : "") + b.toString(16); }
    sha256Bytes._hex = r;
    var out = new Uint8Array(32);
    for (i = 0; i < 8; i++) {
      out[i * 4] = (h[i] >>> 24) & 255; out[i * 4 + 1] = (h[i] >>> 16) & 255;
      out[i * 4 + 2] = (h[i] >>> 8) & 255; out[i * 4 + 3] = h[i] & 255;
    }
    return out;
  }
  function sha256(s) { sha256Bytes(s); return sha256Bytes._hex; }
  function hexToBytes(h) { var o = new Uint8Array(h.length / 2); for (var i = 0; i < o.length; i++) o[i] = parseInt(h.substr(i * 2, 2), 16); return o; }
  function bytesToHex(b) { var s = ""; for (var i = 0; i < b.length; i++) s += ("0" + b[i].toString(16)).slice(-2); return s; }
  function strToBytes(s) {
    if (typeof TextEncoder !== "undefined") return new TextEncoder().encode(s);
    var o = [];
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 128) o.push(c);
      else if (c < 2048) { o.push(192 | (c >> 6), 128 | (c & 63)); }
      else if (c >= 0xD800 && c <= 0xDBFF && i + 1 < s.length) {
        var c2 = s.charCodeAt(++i); var cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
        o.push(240 | (cp >> 18), 128 | ((cp >> 12) & 63), 128 | ((cp >> 6) & 63), 128 | (cp & 63));
      } else { o.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63)); }
    }
    return new Uint8Array(o);
  }
  function concatBytes(a, b) { var o = new Uint8Array(a.length + b.length); o.set(a, 0); o.set(b, a.length); return o; }
  function hmacSha256(key, msg) {
    if (key.length > 64) key = sha256Bytes(String.fromCharCode.apply(null, key));
    var k = new Uint8Array(64); k.set(key);
    var ipad = new Uint8Array(64), opad = new Uint8Array(64);
    for (var i = 0; i < 64; i++) { ipad[i] = k[i] ^ 0x36; opad[i] = k[i] ^ 0x5c; }
    var inner = sha256Bytes(String.fromCharCode.apply(null, concatBytes(ipad, msg)));
    return sha256Bytes(String.fromCharCode.apply(null, concatBytes(opad, inner)));
  }
  function pbkdf2Raw(password, salt, iterations, keylen) {
    var pw = strToBytes(password), dk = new Uint8Array(keylen);
    var blocks = Math.ceil(keylen / 32);
    for (var i = 1; i <= blocks; i++) {
      var ib = new Uint8Array(4);
      ib[0] = (i >>> 24) & 255; ib[1] = (i >>> 16) & 255; ib[2] = (i >>> 8) & 255; ib[3] = i & 255;
      var u = hmacSha256(pw, concatBytes(salt, ib));
      var t = new Uint8Array(u);
      for (var j = 1; j < iterations; j++) {
        u = hmacSha256(pw, u);
        for (var k = 0; k < t.length; k++) t[k] ^= u[k];
      }
      var off = (i - 1) * 32;
      for (var q = 0; q < 32 && off + q < keylen; q++) dk[off + q] = t[q];
    }
    return dk;
  }
  function pbkdf2Subtle(password, salt, iterations, keylen) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"])
      .then(function (k) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", salt: salt, iterations: iterations, hash: "SHA-256" }, k, keylen * 8);
      })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function hasSubtlePBKDF2() {
    try {
      return !!(window.crypto && window.crypto.subtle && typeof window.crypto.subtle.importKey === "function" &&
        (typeof window.isSecureContext === "undefined" || window.isSecureContext === true));
    } catch (e) { return false; }
  }
  function pbkdf2Hex(password, saltHex, keylen) {
    var salt = hexToBytes(saltHex);
    if (hasSubtlePBKDF2()) {
      return pbkdf2Subtle(password, salt, ADMIN_PBKDF2_ITER, keylen).then(bytesToHex).catch(function () {
        return bytesToHex(pbkdf2Raw(password, salt, ADMIN_PBKDF2_ITER_FALLBACK, keylen));
      });
    }
    return new Promise(function (res) {
      setTimeout(function () { res(bytesToHex(pbkdf2Raw(password, salt, ADMIN_PBKDF2_ITER_FALLBACK, keylen))); }, 0);
    });
  }
  function expectedHash() { return hasSubtlePBKDF2() ? ADMIN_PBKDF2_HASH : ADMIN_PBKDF2_HASH_FALLBACK; }

  /* ---------------- 状态 ---------------- */
  function tableUrl() { return CFG.url + "/rest/v1/form_submissions"; }
  function headers(write) {
    var h = { "apikey": CFG.key, "Authorization": "Bearer " + CFG.key, "Content-Type": "application/json" };
    if (write) { h["Prefer"] = "return=representation"; if (adminToken) h["x-admin-hash"] = adminToken; }
    return h;
  }
  function rest(method, query, body) {
    return fetch(tableUrl() + "?site_id=eq." + encodeURIComponent(CFG.site) + (query || ""), {
      method: method, headers: headers(method !== "GET"), body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) {
        if (!r.ok) {
          var msg = (j && (j.message || j.hint || j.error_description || j.msg)) || ("HTTP " + r.status);
          var err = new Error(msg); err.status = r.status; throw err;
        }
        return j;
      });
    });
  }
  var cloudList = function () { return rest("GET", "&select=*&limit=2000"); };
  var cloudInsert = function (rows) { return rest("POST", "", rows); };
  var cloudUpdate = function (id, payload) { return rest("PATCH", "&id=eq." + encodeURIComponent(id), { payload: payload }); };
  var cloudDelete = function (id) { return rest("DELETE", "&id=eq." + encodeURIComponent(id)); };

  function setSync(state, msg) {
    cloud.state = state; cloud.msg = msg;
    var el = document.getElementById("sync-state");
    if (el) {
      el.textContent = msg;
      el.className = "tag" + (state === "ok" ? " tag-green" : state === "err" ? " tag-red" : "");
    }
  }

  /* ---------------- 本地缓存 ---------------- */
  function cacheRead() {
    try {
      var c = JSON.parse(lsGet(CACHE_KEY) || "null");
      if (c && Array.isArray(c.records) && Array.isArray(c.announces)) return c;
    } catch (e) {}
    return null;
  }
  function cacheWrite() {
    lsSet(CACHE_KEY, JSON.stringify({ records: records, announces: announces, at: Date.now() }));
  }
  function metaRead() { try { return JSON.parse(lsGet(META_KEY) || "{}") || {}; } catch (e) { return {}; } }
  function metaWrite(m) { lsSet(META_KEY, JSON.stringify(m)); }

  /* ---------------- 行 <-> 对象 ---------------- */
  function rowToRecord(row) {
    var p = (row && row.payload) || {};
    if (p.kind !== RECORD_KIND) return null;
    var amount = Number(p.amount) || 0;
    if (!p.item || amount <= 0) return null;
    return {
      id: String(p.rid || row.id), type: p.type === "income" ? "income" : "expense",
      cat: String(p.cat || "其他"), item: String(p.item), amount: amount,
      date: String(p.date || ""), note: String(p.note || ""), by: String(p.by || "管理员"),
      _upd: p.upd || row.created_at || ""
    };
  }
  function rowToAnn(row) {
    var p = (row && row.payload) || {};
    if (p.kind !== ANN_KIND || !p.p) return null;
    return { id: String(p.aid || row.id), _rowId: row.id, t: String(p.t || "班级公告"),
             p: String(p.p), tag: String(p.tag || ""), _upd: p.upd || row.created_at || "" };
  }
  function recordToPayload(r) {
    return { kind: RECORD_KIND, rid: r.id, type: r.type, cat: r.cat, item: r.item,
             amount: Number(r.amount) || 0, date: r.date || "", note: r.note || "",
             by: r.by || "管理员", upd: r._upd || new Date().toISOString() };
  }
  function annToPayload(a) {
    return { kind: ANN_KIND, aid: a.id, t: a.t, p: a.p, tag: a.tag || "", upd: a._upd || new Date().toISOString() };
  }
  function normalizeRecord(r) {
    return {
      id: String(r.id != null ? r.id : uid()),
      type: r.type === "income" ? "income" : "expense",
      cat: String(r.cat || "其他"), item: String(r.item || ""),
      amount: Number(r.amount) || 0, date: String(r.date || ""),
      note: String(r.note || ""), by: String(r.by || "管理员"), _upd: r._upd || ""
    };
  }

  /* ---------------- 统计 ---------------- */
  function sum(list, p) { return list.filter(p).reduce(function (a, r) { return a + Number(r.amount || 0); }, 0); }
  function incomeT() { return sum(records, function (r) { return r.type === "income"; }); }
  function expenseT() { return sum(records, function (r) { return r.type === "expense"; }); }
  function balance() { return incomeT() - expenseT(); }
  function byMonth() {
    var o = {};
    records.forEach(function (r) {
      var m = (r.date || "").slice(0, 7); if (!m) return;
      o[m] || (o[m] = { income: 0, expense: 0 });
      o[m][r.type] += Number(r.amount || 0);
    });
    return o;
  }
  function categoryStats() {
    var o = {};
    records.filter(function (r) { return r.type === "expense"; }).forEach(function (r) {
      o[r.cat] || (o[r.cat] = { cat: r.cat, total: 0, count: 0 });
      o[r.cat].total += Number(r.amount || 0); o[r.cat].count++;
    });
    return Object.values(o);
  }
  function maxExpenseMonth() {
    var b = byMonth(), ks = Object.keys(b);
    if (!ks.length) return "—";
    var mx = ks[0];
    ks.forEach(function (k) { if (b[k].expense > b[mx].expense) mx = k; });
    return Number(mx.slice(5)) + " 月";
  }

  /* ---------------- 本地加载 / 保存 ---------------- */
  function save() {
    lsSet(STORAGE_KEY, JSON.stringify(records.map(function (r) {
      return { id: r.id, type: r.type, cat: r.cat, item: r.item, amount: r.amount,
               date: r.date, note: r.note, by: r.by };
    })));
    cacheWrite();
  }
  function saveAnn() {
    lsSet(ANN_KEY, JSON.stringify(announces.map(function (a) {
      return { id: a.id, t: a.t, p: a.p, tag: a.tag };
    })));
    cacheWrite();
  }
  function annConfiguredLocally() { return lsGet(ANN_KEY) !== null; }
  function loadLocal() {
    var out = [];
    try {
      var s = lsGet(STORAGE_KEY);
      if (s !== null) out = (JSON.parse(s) || []).map(normalizeRecord);
    } catch (e) { out = []; }
    return out.filter(function (r) { return r.item && r.amount > 0; });
  }
  function loadAnnLocal() {
    try {
      var s = lsGet(ANN_KEY);
      if (s !== null) {
        var a = JSON.parse(s);
        if (Array.isArray(a)) {
          return a.map(function (x) {
            var o = { id: String(x.id || ("a" + uid())), t: x.t, p: x.p, tag: x.tag || "", _upd: x._upd || "" };
            annDirty.add(o.id); return o;
          });
        }
      }
    } catch (e) {}
    return [];
  }

  /* ---------------- 拉取云端 ---------------- */
  function pullCloud(manual) {
    if (!cloud.online) { setSync("off", "本地缓存模式"); if (manual) toast("未接入云端，正在使用本机缓存"); return Promise.resolve(); }
    if (cloud.syncing) { cloud.queued = true; return Promise.resolve(); }
    cloud.syncing = true; cloud.queued = false;
    setSync("busy", "同步中…");
    return cloudList().then(function (rows) {
      rows = rows || [];
      var cRecs = rows.map(rowToRecord).filter(Boolean);
      var cAnns = rows.map(rowToAnn).filter(Boolean);
      var hasCloudData = cRecs.length > 0 || cAnns.length > 0;
      var meta = metaRead();
      cloudKnownAids = new Set(cAnns.map(function (a) { return String(a._rowId); }));

      if (!hasCloudData && (records.length || announces.length)) {
        if (adminMode || meta.pushedOnce) return pushCloud(true, "full");
        setSync("ok", "已就绪 · 本机 " + records.length + " 笔");
        if (!adminMode && !meta.pushedOnce && !annConfiguredLocally() && !records.length) {
          toast("云端暂无数据，请班委登录管理员后完成首次上传", "warn");
        }
        return null;
      } else if (hasCloudData) {
        var merged = cRecs.map(function (c) {
          var l = records.find(function (x) { return x.id === c.id; });
          return (l && recDirty.has(l.id)) ? l : c;
        });
        var known = new Set(merged.map(function (r) { return r.id; }));
        records.forEach(function (l) { if (recDirty.has(l.id) && !known.has(l.id)) merged.push(l); });
        merged.sort(function (a, b) {
          return (a.date || "").localeCompare(b.date || "") || String(a.id).localeCompare(String(b.id));
        });
        records = merged;

        var annMerged = cAnns.map(function (c) {
          var l = announces.find(function (x) { return x.id === c.id; });
          return (l && annDirty.has(l.id)) ? l : c;
        });
        var annKnown = new Set(annMerged.map(function (a) { return a.id; }));
        announces.forEach(function (l) { if (annDirty.has(l.id) && !annKnown.has(l.id)) annMerged.push(l); });
        announces = annMerged;

        cacheWrite();
        if (!meta.pushedOnce) { meta.pushedOnce = true; metaWrite(meta); }
        if (recDirty.size || annDirty.size || recDeleted.size) return pushCloud(true, "dirty");
      } else {
        cacheWrite();
      }
      if (manual) toast("已与云端同步");
      return null;
    }).catch(function (e) {
      setSync("err", "云端连接失败");
      if (manual) toast("同步失败：" + (e.message || e), "err");
      console.warn("[班费] 云端拉取失败：", e);
    }).then(function () {
      cloud.syncing = false;
      if (cloud.queued) { cloud.queued = false; pullCloud(false); }
    });
  }

  /* ---------------- 推送云端 ---------------- */
  function pushCloud(silent, mode) {
    if (!cloud.online) return Promise.resolve(false);
    if (!adminToken && !adminMode) {
      if (!silent) toast("请先登录管理员再同步", "warn");
      return Promise.resolve(false);
    }
    if (cloud.syncing) { cloud.queued = true; return Promise.resolve(true); }
    if (!mode) mode = "dirty";
    if (mode === "dirty" && !recDirty.size && !annDirty.size && !recDeleted.size) return Promise.resolve(true);
    cloud.syncing = true; cloud.queued = false;
    setSync("busy", "上传中…");
    return cloudList().then(function (rows) {
      rows = rows || [];
      var byRid = new Map(), byAid = new Map();
      rows.forEach(function (row) {
        var p = row.payload || {};
        if (p.kind === RECORD_KIND && p.rid) byRid.set(String(p.rid), row);
        else if (p.kind === ANN_KIND && p.aid) byAid.set(String(p.aid), row);
      });
      var nowIso = new Date().toISOString();
      var ops = [], toInsert = [], annToInsert = [];

      records.forEach(function (r) {
        if (!r._upd) r._upd = nowIso;
        var row = byRid.get(r.id), p = recordToPayload(r);
        if (!row) toInsert.push(p);
        else {
          var old = row.payload || {};
          if (JSON.stringify([old.type, old.cat, old.item, old.amount, old.date, old.note, old.by]) !==
              JSON.stringify([p.type, p.cat, p.item, p.amount, p.date, p.note, p.by])) {
            ops.push(cloudUpdate(row.id, p));
          }
        }
        byRid.delete(r.id);
      });
      if (mode === "full") byRid.forEach(function (row) { ops.push(cloudDelete(row.id)); });
      else recDeleted.forEach(function (id) {
        var row = byRid.get(id);
        if (row) { ops.push(cloudDelete(row.id)); byRid.delete(id); }
      });

      announces.forEach(function (a) {
        if (!a._upd) a._upd = nowIso;
        var row = byAid.get(a.id), p = annToPayload(a);
        if (!row) annToInsert.push(p);
        else {
          var old = row.payload || {};
          if (JSON.stringify([old.t, old.p, old.tag]) !== JSON.stringify([p.t, p.p, p.tag])) ops.push(cloudUpdate(row.id, p));
        }
        byAid.delete(a.id);
      });
      if (mode === "full") byAid.forEach(function (row) { ops.push(cloudDelete(row.id)); });
      else {
        annDirty.forEach(function (aid) {
          var row = byAid.get(aid);
          if (row) { ops.push(cloudDelete(row.id)); byAid.delete(aid); }
        });
        if (annConfiguredLocally()) {
          byAid.forEach(function (row, aid) { ops.push(cloudDelete(row.id)); byAid.delete(aid); });
        }
      }

      if (toInsert.length) ops.push(cloudInsert(toInsert.map(function (p) { return { site_id: CFG.site, payload: p }; })));
      if (annToInsert.length) ops.push(cloudInsert(annToInsert.map(function (p) { return { site_id: CFG.site, payload: p }; })));
      return Promise.all(ops);
    }).then(function () {
      recDirty.clear(); annDirty.clear(); recDeleted.clear();
      cloudKnownAids = new Set(announces.map(function (a) { return String(a.id); }));
      var meta = metaRead(); meta.pushedOnce = true; metaWrite(meta);
      cacheWrite();
      setSync("ok", "已同步 · " + records.length + " 笔收支 / " + announces.length + " 条公告");
      if (!silent) toast("已保存并同步到云端");
      if (typeof window.__bfRefresh === "function") window.__bfRefresh();
      return true;
    }).catch(function (e) {
      setSync("err", "上传失败");
      console.warn("[班费] 云端写入失败：", e);
      if (!silent) toast("云端保存失败：" + (e.message || e) + "（已存本机，可稍后重试）", "err");
      return false;
    }).then(function (v) {
      cloud.syncing = false;
      if (cloud.queued) { cloud.queued = false; pushCloud(true, "dirty"); }
      return v;
    });
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    initCloud();
    cloud.msg = cloud.online ? "连接云端…" : "本地缓存模式";
    var cached = cacheRead();
    if (cached && (cached.records.length || cached.announces.length)) {
      records = cached.records.map(normalizeRecord).filter(function (r) { return r.item && r.amount > 0; });
      announces = cached.announces;
      if (!annConfiguredLocally()) announces = loadAnnLocal();
    } else {
      records = loadLocal();
      announces = loadAnnLocal();
    }
    if (cloud.online) pullCloud(false); else setSync("off", "本地缓存模式");
  }

  /* ---------------- 管理员 ---------------- */
  function verifyAdmin(pwd) {
    return pbkdf2Hex(pwd, ADMIN_PBKDF2_SALT, 32).then(function (hex) {
      if (hex !== expectedHash()) return false;
      adminMode = true;
      adminToken = sha256(pwd);
      announces.forEach(function (a) { annDirty.add(a.id); });
      records.forEach(function (r) { recDirty.add(r.id); });
      pushCloud(false, "full");
      return true;
    });
  }

  /* ---------------- 对外 ---------------- */
  window.BF = {
    CLASS_NAME: CLASS_NAME, CATEGORIES: CATEGORIES,
    /* CFG / cloud 用取值函数暴露，保证始终读到当前值（就地更新会保留引用） */
    get CFG() { return CFG; },
    get siteId() { return CFG.site; },
    get records() { return records; },
    get announces() { return announces; },
    get adminMode() { return adminMode; },
    get cloud() { return cloud; },
    boot: boot, pullCloud: pullCloud, pushCloud: pushCloud, setSync: setSync,
    verifyAdmin: verifyAdmin, fmt: fmt, todayISO: todayISO, uid: uid,
    esc: escapeHtml, iconChar: iconChar,
    incomeT: incomeT, expenseT: expenseT, balance: balance,
    byMonth: byMonth, categoryStats: categoryStats, maxExpenseMonth: maxExpenseMonth,
    sum: sum, save: save, saveAnn: saveAnn,
    normalizeRecord: normalizeRecord,
    /* 数组是 getter-only：外部不能用 BF.records = ... 赋值（严格模式下会静默失败）。
       增删改一律走下面这几个方法，它们就地修改同一个数组，引用不会断。 */
    addRecord: function (r) { records.push(r); return r; },
    updateRecord: function (id, patch) {
      var i = records.findIndex(function (r) { return String(r.id) === String(id); });
      if (i < 0) return null;
      records[i] = Object.assign({}, records[i], patch);
      return records[i];
    },
    removeRecord: function (id) {
      var before = records.length;
      records = records.filter(function (r) { return String(r.id) !== String(id); });
      recDirty.delete(String(id)); recDeleted.add(String(id));
      cacheWrite();
      return records.length < before;
    },
    addAnnounce: function (a) { announces.push(a); return a; },
    updateAnnounce: function (i, a) { if (i < 0 || i >= announces.length) return null; announces[i] = a; return a; },
    removeAnnounce: function (i) {
      if (i < 0 || i >= announces.length) return null;
      var gone = announces[i];
      announces.splice(i, 1);
      annDirty.add(String(gone.id));
      cacheWrite();
      return gone;
    },
    clearAnnounces: function () {
      var ids = announces.map(function (a) { annDirty.add(String(a.id)); return a.id; });
      announces.length = 0;
      cacheWrite();
      return ids;
    },
    markRecordDirty: function (id) { recDirty.add(id); },
    markRecordDeleted: function (id) { recDirty.delete(id); recDeleted.add(id); },
    markAnnDirty: function (id) { annDirty.add(id); },
    cacheWrite: cacheWrite,
    prefs: {
      read: function () { try { return JSON.parse(lsGet(PREF_KEY) || "{}") || {}; } catch (e) { return {}; } },
      write: function (o) { lsSet(PREF_KEY, JSON.stringify(o || {})); }
    }
  };
})();

</script>

<!-- ============ 班费公示 · 页面层 ============ -->
<script>
/* ==========================================================================
 * 班费公示 · 页面层
 * 三个页面（公示总览 / 收支明细 / 收支分析）挂到框架的 PAGES 表上，
 * 导航、切页动效、主题、自适应缩放全部由 StudyLens 框架负责。
 * 数据一律走 BF（数据层），与旧版数据库契约完全一致。
 * ========================================================================== */
(function () {
  "use strict";

  var BF = window.BF;
  var esc = BF.esc;

  /* ---------------- 供页面复用的展示片段 ---------------- */
  function stateTag(state, text) {
    var cls = state === "ok" ? "tag tag-green" : state === "err" ? "tag tag-red" : "tag";
    return '<span class="' + cls + '" id="sync-state">' + esc(text) + "</span>";
  }

  function liRow(r) {
    var inC = r.type === "income";
    return '<div class="bf-li ' + (inC ? "in" : "out") + '">' +
      '<span class="bf-li-ico ' + (inC ? "in" : "out") + '">' + esc(BF.iconChar(r.cat)) + "</span>" +
      '<span class="bf-li-main"><b>' + esc(r.item) + "</b>" +
      "<span>" + esc(r.date || "—") + " · " + esc(r.cat) + " · " + esc(r.by || "—") + "</span></span>" +
      '<span class="bf-li-side"><span class="tag">' + (inC ? "收入" : "支出") + "</span>" +
      '<b class="' + (inC ? "in" : "out") + '">' + (inC ? "+" : "−") + "¥" + BF.fmt(r.amount) + "</b></span>" +
      (BF.adminMode
        ? '<span class="bf-li-ops">' +
          '<button class="btn btn-sm" data-edit="' + esc(r.id) + '" title="修改这条记录" aria-label="修改">' +
          '<span class="ico" data-icon="penLine"></span></button>' +
          '<button class="btn btn-sm btn-danger" data-del="' + esc(r.id) + '" title="删除" aria-label="删除">' +
          '<span class="ico" data-icon="trash"></span></button></span>'
        : "") +
      "</div>";
  }

  function annCard(a, i) {
    return '<div class="card bf-ann">' +
      '<div class="card-title"><span class="dot"></span>' + esc(a.t) +
      (BF.adminMode
        ? '<span class="bf-ann-ops">' +
          '<button class="btn btn-sm" data-ann="edit:' + i + '" title="编辑公告" aria-label="编辑公告">' +
          '<span class="ico" data-icon="edit"></span></button>' +
          '<button class="btn btn-sm btn-danger" data-ann="del:' + i + '" title="删除公告" aria-label="删除公告">' +
          '<span class="ico" data-icon="x"></span></button></span>'
        : "") +
      "</div>" +
      '<p class="bf-ann-body">' + esc(a.p) + "</p>" +
      (a.tag ? '<div class="row" style="margin-top:10px"><span class="tag">' + esc(a.tag) + "</span></div>" : "") +
      "</div>";
  }

  /* 管理员入口：未登录显示密码按钮，已登录显示身份标识 */
  function adminSlot() {
    if (BF.adminMode) {
      return '<span class="tag tag-green" id="admin-slot">管理员</span>' +
        '<button class="btn btn-sm btn-primary" data-add-rec><span class="ico" data-icon="save"></span>添加收支</button>';
    }
    return '<button class="btn btn-sm" data-admin-login><span class="ico" data-icon="user"></span>管理员登录</button>';
  }

  /* ---------------- 1. 公示总览 ---------------- */
  function renderOverview() {
    var bal = BF.balance(), inT = BF.incomeT(), outT = BF.expenseT();
    var has = BF.records.length > 0;
    var recent = has ? BF.records.slice().sort(function (a, b) {
      return (b.date || "").localeCompare(a.date || "");
    }).slice(0, 5) : [];
    var cats = BF.categoryStats().sort(function (a, b) { return b.total - a.total; }).slice(0, 4);

    var html =
      '<div class="topbar"><div><h1>公示总览</h1>' +
      '<div class="sub">' + esc(BF.CLASS_NAME) + " · 班级班费收支与结余一览</div></div>" +
      '<div class="row" style="gap:8px;align-items:center">' +
      stateTag(BF.cloud.state, BF.cloud.msg) + adminSlot() + "</div></div>";

    /* 结余：无界并列数字行（框架组件） */
    html += UI.card("班费当前结余",
      '<div class="bf-balance">¥' + BF.fmt(bal) + "</div>" +
      '<div class="muted small" style="margin-top:6px">班级：' + esc(BF.CLASS_NAME) +
      (BF.cloud.online ? " · 数据来源：云数据库实时公示" : " · 数据来源：本机缓存") + "</div>" +
      UI.statRow([[BF.fmt(inT), "累计收入"], [BF.fmt(outT), "累计支出"], [String(BF.records.length), "记录条数"]])
    );

    html += '<div class="card"><div class="card-title"><span class="dot"></span>最近收支' +
      '<span class="muted small" style="margin-left:auto">最新 5 笔</span></div>' +
      (has ? '<div class="bf-list">' + recent.map(liRow).join("") + "</div>"
           : UI.empty("暂无班费记录，等待管理员录入")) + "</div>";

    html += '<div class="card"><div class="card-title"><span class="dot"></span>班级公告</div>' +
      (BF.announces.length
        ? '<div class="bf-anns">' + BF.announces.map(annCard).join("") + "</div>"
        : UI.empty("暂无公告")) + "</div>";

    html += '<div class="card"><div class="card-title"><span class="dot"></span>支出分类占比' +
      '<span class="muted small" style="margin-left:auto">按金额</span></div>' +
      (cats.length ? cats.map(function (c) {
        var pct = outT ? Math.round(c.total / outT * 100) : 0;
        return '<div class="bf-cat"><div class="bf-cat-head"><span>' + esc(c.cat) + "</span><span>" +
          "¥" + BF.fmt(c.total) + " · " + pct + "%</span></div>" +
          '<div class="bf-bar"><i style="width:' + pct + '%"></i></div></div>';
      }).join("") : '<p class="muted">暂无支出记录</p>') + "</div>";

    document.getElementById("page-overview").innerHTML = html;
  }

  /* ---------------- 2. 收支明细 ---------------- */
  var ledgerFilter = { q: "", type: "all", cat: "all" };

  function matched() {
    var q = ledgerFilter.q.toLowerCase();
    return BF.records.filter(function (r) {
      if (ledgerFilter.type !== "all" && r.type !== ledgerFilter.type) return false;
      if (ledgerFilter.cat !== "all" && r.cat !== ledgerFilter.cat) return false;
      if (q) {
        if (!((r.item + " " + r.cat + " " + r.by + " " + (r.note || "")).toLowerCase().indexOf(q) >= 0)) return false;
      }
      return true;
    }).sort(function (a, b) { return (b.date || "").localeCompare(a.date || ""); });
  }

  function ledgerBody(list) {
    if (!BF.records.length) return UI.empty(BF.adminMode ? "还没有记录，点右上角「添加收支」录入第一条" : "等待管理员录入第一条记录");
    if (!list.length) return UI.empty("当前筛选条件下暂无记录");
    var byDate = {};
    list.forEach(function (r) {
      var k = (r.date || "").slice(0, 7) || "未标注日期";
      (byDate[k] = byDate[k] || []).push(r);
    });
    return Object.keys(byDate).sort().reverse().map(function (k) {
      return '<div class="bf-group"><div class="bf-group-head">' + esc(k) + " 月</div>" +
        byDate[k].map(liRow).join("") + "</div>";
    }).join("");
  }

  function renderLedger() {
    var list = matched();
    var cats = [];
    BF.records.forEach(function (r) { if (cats.indexOf(r.cat) < 0) cats.push(r.cat); });
    var sumIn = BF.sum(list, function (r) { return r.type === "income"; });
    var sumOut = BF.sum(list, function (r) { return r.type === "expense"; });

    var html =
      '<div class="topbar"><div><h1>收支明细</h1>' +
      '<div class="sub">按月份分组，支持筛选与搜索</div></div>' +
      '<div class="row" style="gap:8px;align-items:center">' +
      stateTag(BF.cloud.state, BF.cloud.msg) + adminSlot() + "</div></div>";

    html += UI.card("", UI.statRow([[BF.fmt(sumIn), "筛出收入"], [BF.fmt(sumOut), "筛出支出"],
      [BF.fmt(sumIn - sumOut), "净流入"]]));

    html += '<div class="card"><div class="bf-toolbar">' +
      '<label class="bf-search"><span class="ico" data-icon="search"></span>' +
      '<input id="ledger-q" placeholder="搜索事项 / 分类 / 经办人…" value="' + esc(ledgerFilter.q) + '"></label>' +
      '<div class="bf-seg" id="ledger-type">' +
      ["all", "income", "expense"].map(function (t) {
        var nm = t === "all" ? "全部" : t === "income" ? "收入" : "支出";
        return '<button class="btn btn-sm' + (ledgerFilter.type === t ? " btn-primary" : "") +
          '" data-t="' + t + '">' + nm + "</button>";
      }).join("") + "</div>" +
      '<select class="bf-select" id="ledger-cat"><option value="all">全部分类</option>' +
      cats.map(function (c) {
        return '<option value="' + esc(c) + '"' + (ledgerFilter.cat === c ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("") + "</select>" +
      '<span class="muted small" id="ledger-sum">筛出 ' + list.length + " 笔</span>" +
      "</div>" +
      '<div id="ledger-body">' + ledgerBody(list) + "</div></div>";

    document.getElementById("page-ledger").innerHTML = html;
  }

  /* ---------------- 3. 收支分析 ---------------- */
  function renderAnalysis() {
    var html =
      '<div class="topbar"><div><h1>收支分析</h1>' +
      '<div class="sub">趋势与分类占比统计</div></div>' +
      '<div class="row" style="gap:8px;align-items:center">' +
      stateTag(BF.cloud.state, BF.cloud.msg) + adminSlot() + "</div></div>";

    if (!BF.records.length) {
      html += '<div class="card">' + UI.empty("暂无数据可分析，录入班费收支后展示按月趋势与分类占比") + "</div>";
      document.getElementById("page-analysis").innerHTML = html;
      return;
    }

    var inT = BF.incomeT(), outT = BF.expenseT();
    var months = Object.keys(BF.byMonth()).sort();
    var bm = BF.byMonth();
    var incArr = months.map(function (m) { return bm[m].income; });
    var expArr = months.map(function (m) { return bm[m].expense; });
    var maxV = Math.max.apply(null, incArr.concat(expArr).concat([1]));
    var cats = BF.categoryStats().sort(function (a, b) { return b.total - a.total; });

    html += UI.card("",
      UI.statRow([[inT ? Math.round(Math.abs(BF.balance()) / inT * 100) + "%" : "0%", "结余留存率"],
                  [BF.maxExpenseMonth(), "最大支出月"]]));

    /* 月度走势：横向并排柱，柱子高度按值 */
    html += '<div class="card"><div class="card-title"><span class="dot"></span>月度收支走势' +
      '<span class="muted small" style="margin-left:auto">单位：元</span></div>' +
      '<div class="bf-chart">' + months.map(function (m, i) {
        var ih = Math.max(4, Math.round(incArr[i] / maxV * 132));
        var eh = Math.max(4, Math.round(expArr[i] / maxV * 132));
        return '<div class="bf-col"><div class="bf-rows">' +
          '<div class="bf-bw"><em>' + (incArr[i] ? "+" + Math.round(incArr[i]) : "") + "</em>" +
          '<i class="bf-bar-v in" style="height:' + ih + 'px"></i></div>' +
          '<div class="bf-bw"><em>' + (expArr[i] ? "−" + Math.round(expArr[i]) : "") + "</em>" +
          '<i class="bf-bar-v out" style="height:' + eh + 'px"></i></div>' +
          '</div><span class="bf-vlab">' + Number(m.slice(5)) + "月</span></div>";
      }).join("") + "</div>" +
      '<div class="row" style="gap:16px;margin-top:12px">' +
      '<span class="muted small"><i class="bf-sw in"></i>收入</span>' +
      '<span class="muted small"><i class="bf-sw out"></i>支出</span></div></div>';

    /* 分类支出排行 */
    html += '<div class="card"><div class="card-title"><span class="dot"></span>分类支出排行' +
      '<span class="muted small" style="margin-left:auto">按金额</span></div>' +
      '<div class="grid grid-2">' + cats.map(function (c) {
        var pct = outT ? Math.round(c.total / outT * 100) : 0;
        return '<div class="bf-tile"><div class="row" style="justify-content:space-between;align-items:baseline">' +
          '<b class="bf-tile-num">¥' + BF.fmt(c.total) + "</b>" +
          '<span class="tag">' + c.count + " 笔</span></div>" +
          '<div class="muted small" style="margin:4px 0 10px">' + esc(c.cat) + "</div>" +
          '<div class="bf-bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="muted small" style="margin-top:6px">占支出 ' + pct + "%</div></div>";
      }).join("") + "</div></div>";

    document.getElementById("page-analysis").innerHTML = html;
  }

  /* ---------------- 4. 设置（本机偏好 / 关于） ---------------- */
  function renderSettings() {
    var p = BF.prefs.read();
    var html =
      '<div class="topbar"><div><h1>设置</h1><div class="sub">外观、数据来源与本机缓存</div></div></div>';

    html += UI.card("外观",
      UI.kv("主题", '<select class="bf-select" id="pref-theme">' +
        ["auto", "light", "dark"].map(function (v) {
          var nm = v === "auto" ? "跟随系统" : v === "light" ? "浅色" : "深色";
          return '<option value="' + v + '"' + ((p.theme || "auto") === v ? " selected" : "") + ">" + nm + "</option>";
        }).join("") + "</select>") +
      UI.kv("强调色", '<select class="bf-select" id="pref-accent">' +
        Object.keys(ACCENTS).map(function (k) {
          return '<option value="' + k + '"' + ((p.accent || "graphite") === k ? " selected" : "") + ">" + ACCENTS[k] + "</option>";
        }).join("") + "</select>")
    );

    html += UI.card("数据来源",
      UI.kv("云端", BF.cloud.online ? "已连接 Supabase" : "未连接（本机缓存模式）") +
      UI.kv("分区键 site_id", esc(BF.CFG.site || "—")) +
      UI.kv("本机记录", BF.records.length + " 笔") +
      UI.kv("本机公告", BF.announces.length + " 条") +
      '<div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-sm" id="pref-sync"><span class="ico" data-icon="refresh"></span>立即从云端同步</button>' +
      '<button class="btn btn-sm" id="pref-clear"><span class="ico" data-icon="trash"></span>清除本机缓存</button>' +
      "</div>" +
      '<p class="muted small" style="margin-top:10px">清除本机缓存只会清空这台设备上的副本，' +
      "云端数据不受影响，下次打开会重新拉取。</p>"
    );

    html += UI.card("关于",
      UI.kv("班级", esc(BF.CLASS_NAME)) +
      UI.kv("说明", "班费收支与班级公告公开可查，班委凭密码维护") +
      UI.kv("界面框架", "StudyLens 前端框架（外壳 / 导航 / 动效 / 主题 / 自适应缩放）")
    );

    document.getElementById("page-settings").innerHTML = html;
  }

  /* ---------------- 挂到框架 PAGES ---------------- */
  PAGES.overview = { label: "公示总览", icon: "grid", nav: true, render: renderOverview };
  PAGES.ledger = { label: "收支明细", icon: "list", nav: true, render: renderLedger };
  PAGES.analysis = { label: "收支分析", icon: "trend", nav: true, render: renderAnalysis };
  PAGES.settings = { label: "设置", icon: "settings", nav: true, render: renderSettings };
  delete PAGES.dashboard;
  delete PAGES.content;
  delete PAGES.profile;

  /* ---------------- 交互 ---------------- */
  function refresh() {
    if (typeof window.__bfRefresh === "function") window.__bfRefresh();
  }

  /* 管理员登录：框架弹层 + PBKDF2 校验 */
  function openAdminLogin() {
    openModal('<h3>管理员验证</h3>' +
      '<p class="muted" style="margin-top:6px;line-height:1.7">管理功能仅对班委开放。<br>' +
      "登录状态只在本次访问有效，刷新或重新打开都需要重新验证。</p>" +
      '<div class="field" style="margin-top:16px"><label for="adm-pwd">管理员密码</label>' +
      '<input id="adm-pwd" type="password" autocomplete="off" placeholder="请输入密码"></div>' +
      '<div id="adm-err" class="auth-err" style="min-height:18px"></div>' +
      '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:8px">' +
      '<button class="btn" onclick="AppUI.closeModal()">取消</button>' +
      '<button class="btn btn-primary" id="adm-ok">验证进入</button></div>');
    var inp = document.getElementById("adm-pwd");
    if (inp) setTimeout(function () { inp.focus(); }, 60);
    function submit() {
      var v = (document.getElementById("adm-pwd") || {}).value || "";
      var err = document.getElementById("adm-err");
      var btn = document.getElementById("adm-ok");
      if (!v) { if (err) err.textContent = "请输入管理员密码"; return; }
      if (btn) { btn.disabled = true; btn.textContent = "验证中…"; }
      BF.verifyAdmin(v).then(function (ok) {
        if (btn) { btn.disabled = false; btn.textContent = "验证进入"; }
        if (ok) {
          AppUI.closeModal();
          toast("管理模式已启用（本次访问有效），正在同步云端…");
          refresh();
        } else {
          if (err) err.textContent = "密码错误，请重试";
          if (inp) inp.select();
        }
      }).catch(function () {
        if (btn) { btn.disabled = false; btn.textContent = "验证进入"; }
        if (err) err.textContent = "校验失败，请刷新页面重试";
      });
    }
    var ok = document.getElementById("adm-ok");
    if (ok) ok.addEventListener("click", submit);
    if (inp) inp.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  }

  /* 新增 / 修改收支 */
  var recEditId = null;
  function openRecEditor(editId) {
    if (!BF.adminMode) { toast("请先登录管理员", "warn"); return; }
    recEditId = (editId != null) ? String(editId) : null;
    var rec = recEditId ? BF.records.find(function (r) { return String(r.id) === recEditId; }) : null;
    if (recEditId && !rec) { toast("找不到这条记录", "err"); return; }
    var type = rec ? rec.type : "income";
    var catList = BF.CATEGORIES[type];

    openModal("<h3>" + (rec ? "修改收支记录" : "新增收支记录") + "</h3>" +
      '<p class="muted" style="margin-top:6px">' + (rec ? "改动会立即同步到云端公示" : "按类别填写本次班费信息") + "</p>" +
      '<div class="grid grid-2" style="gap:10px;margin-top:14px">' +
      '<div class="field"><label for="rec-type">收支类型</label><select id="rec-type">' +
      '<option value="income"' + (type === "income" ? " selected" : "") + ">收入（入账）</option>" +
      '<option value="expense"' + (type === "expense" ? " selected" : "") + ">支出（消费）</option></select></div>" +
      '<div class="field"><label for="rec-cat">分类</label><select id="rec-cat">' +
      catList.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + "</option>"; }).join("") +
      "</select></div></div>" +
      '<div class="field"><label for="rec-item">事项名称 *</label>' +
      '<input id="rec-item" placeholder="如：春游租车费" value="' + esc(rec ? rec.item : "") + '"></div>' +
      '<div class="grid grid-2" style="gap:10px">' +
      '<div class="field"><label for="rec-amount">金额（元）*</label>' +
      '<input id="rec-amount" type="number" min="0.01" step="0.01" placeholder="0.00" value="' + (rec ? rec.amount : "") + '"></div>' +
      '<div class="field"><label for="rec-date">日期</label>' +
      '<input id="rec-date" type="date" value="' + esc(rec ? rec.date : BF.todayISO()) + '"></div></div>' +
      '<div class="field"><label for="rec-note">经办人 / 备注</label>' +
      '<input id="rec-note" placeholder="谁收取 / 用途说明" value="' + esc(rec ? rec.note : "") + '"></div>' +
      '<div id="rec-err" class="auth-err" style="min-height:18px"></div>' +
      '<div class="row" style="justify-content:flex-end;gap:8px">' +
      '<button class="btn" onclick="AppUI.closeModal()">取消</button>' +
      '<button class="btn btn-primary" id="rec-save">' + (rec ? "保存修改" : "保存记录") + "</button></div>");

    var typeEl = document.getElementById("rec-type");
    var catEl = document.getElementById("rec-cat");
    if (rec && catList.indexOf(rec.cat) < 0) {
      var o = document.createElement("option"); o.value = rec.cat; o.textContent = rec.cat; catEl.appendChild(o);
    }
    if (rec) catEl.value = rec.cat;
    if (typeEl) typeEl.addEventListener("change", function () {
      catEl.innerHTML = BF.CATEGORIES[typeEl.value].map(function (c) {
        return '<option value="' + esc(c) + '">' + esc(c) + "</option>";
      }).join("");
    });

    var save = document.getElementById("rec-save");
    if (save) save.addEventListener("click", function () {
      var item = document.getElementById("rec-item").value.trim();
      var amount = parseFloat(document.getElementById("rec-amount").value);
      var err = document.getElementById("rec-err");
      if (!item || !amount || amount <= 0) { if (err) err.textContent = "请填写事项名称与有效金额"; return; }
      var patch = {
        type: typeEl.value, cat: catEl.value, item: item, amount: amount,
        date: document.getElementById("rec-date").value || BF.todayISO(),
        note: document.getElementById("rec-note").value.trim(),
        by: "管理员", _upd: new Date().toISOString()
      };
      if (recEditId) {
        var updated = BF.updateRecord(recEditId, patch);
        if (!updated) { if (err) err.textContent = "记录已不存在，请刷新"; return; }
        BF.markRecordDirty(recEditId);
        toast("记录已修改并同步云端");
      } else {
        var nr = BF.addRecord(Object.assign({ id: BF.uid() }, patch));
        BF.markRecordDirty(nr.id);
        toast("记录已添加并同步公示");
      }
      recEditId = null;
      BF.save(); BF.pushCloud(); AppUI.closeModal(); refresh();
    });
  }

  /* 公告编辑 */
  var annEditIdx = -1;
  function openAnnEditor(i) {
    if (!BF.adminMode) { toast("请先登录管理员", "warn"); return; }
    annEditIdx = i;
    var a = i >= 0 ? BF.announces[i] : null;
    openModal("<h3>" + (a ? "编辑公告" : "新增公告") + "</h3>" +
      '<p class="muted" style="margin-top:6px">仅管理员可修改并同步公示</p>' +
      '<div class="field" style="margin-top:14px"><label for="ann-title">公告标题</label>' +
      '<input id="ann-title" placeholder="如：班费管理说明" value="' + esc(a ? a.t : "") + '"></div>' +
      '<div class="field"><label for="ann-body">公告内容 *</label>' +
      '<textarea id="ann-body" rows="5" placeholder="输入公告正文，可换行">' + esc(a ? a.p : "") + "</textarea></div>" +
      '<div class="field"><label for="ann-tag">标签（可选）</label>' +
      '<input id="ann-tag" placeholder="如：管理规范" value="' + esc(a ? a.tag : "") + '"></div>' +
      '<div id="ann-err" class="auth-err" style="min-height:18px"></div>' +
      '<div class="row" style="justify-content:flex-end;gap:8px">' +
      (a ? '<button class="btn btn-danger" id="ann-del">删除</button>' : "") +
      '<button class="btn" onclick="AppUI.closeModal()">取消</button>' +
      '<button class="btn btn-primary" id="ann-save">保存公告</button></div>');

    var sv = document.getElementById("ann-save");
    if (sv) sv.addEventListener("click", function () {
      var t = document.getElementById("ann-title").value.trim() || "班级公告";
      var p = document.getElementById("ann-body").value.trim();
      var tag = document.getElementById("ann-tag").value.trim();
      if (!p) { document.getElementById("ann-err").textContent = "请填写公告内容"; return; }
      var nowIso = new Date().toISOString();
      if (annEditIdx >= 0) {
        var cur = BF.announces[annEditIdx];
        BF.updateAnnounce(annEditIdx, { id: cur.id, t: t, p: p, tag: tag, _upd: nowIso });
        BF.markAnnDirty(cur.id);
        toast("公告已更新并同步");
      } else {
        var na = BF.addAnnounce({ id: "a" + BF.uid(), t: t, p: p, tag: tag, _upd: nowIso });
        BF.markAnnDirty(na.id);
        toast("公告已发布并同步");
      }
      BF.saveAnn(); BF.pushCloud(); AppUI.closeModal(); refresh();
    });
    var dl = document.getElementById("ann-del");
    if (dl) dl.addEventListener("click", function () {
      if (annEditIdx < 0) return;
      BF.removeAnnounce(annEditIdx);
      BF.saveAnn(); BF.pushCloud(true); AppUI.closeModal(); refresh();
      toast("公告已删除");
    });
  }

  /* 删除记录确认 */
  function confirmDelete(id) {
    var r = BF.records.find(function (x) { return String(x.id) === String(id); });
    if (!r) return;
    openModal("<h3>删除该记录？</h3>" +
      '<p class="muted" style="margin-top:6px">「' + esc(r.item) + "」±¥" + BF.fmt(r.amount) +
      " · " + esc(r.date || "—") + "</p>" +
      '<div class="row" style="justify-content:flex-end;gap:8px;margin-top:18px">' +
      '<button class="btn" onclick="AppUI.closeModal()">取消</button>' +
      '<button class="btn btn-danger" id="del-ok">确认删除</button></div>');
    var ok = document.getElementById("del-ok");
    if (ok) ok.addEventListener("click", function () {
      BF.removeRecord(String(id));
      BF.save(); BF.pushCloud(true); AppUI.closeModal(); refresh();
      toast("记录已删除");
    });
  }

  /* ---------------- 事件委托（每次切页后重挂，用标记防重复） ---------------- */
  var host = document.getElementById("main-area");
  host.addEventListener("click", function (e) {
    var t = e.target;
    var hit = function (sel) { return t.closest ? t.closest(sel) : null; };

    if (hit("[data-admin-login]")) { openAdminLogin(); return; }
    if (hit("[data-add-rec]")) { openRecEditor(null); return; }
    var ed = hit("[data-edit]");
    if (ed) { openRecEditor(ed.getAttribute("data-edit")); return; }
    var dl = hit("[data-del]");
    if (dl) { confirmDelete(dl.getAttribute("data-del")); return; }
    var an = hit("[data-ann]");
    if (an) {
      var parts = an.getAttribute("data-ann").split(":");
      var idx = Number(parts[1]);
      if (parts[0] === "edit") openAnnEditor(idx);
      else {
        if (BF.removeAnnounce(idx)) {
          BF.saveAnn(); BF.pushCloud(true); refresh();
          toast("公告已删除");
        }
      }
      return;
    }
    var seg = hit("#ledger-type [data-t]");
    if (seg) { ledgerFilter.type = seg.getAttribute("data-t"); AppUI.rerender(); return; }
  });

  host.addEventListener("input", function (e) {
    if (e.target && e.target.id === "ledger-q") {
      ledgerFilter.q = e.target.value;
      clearTimeout(window.__bfQ);
      window.__bfQ = setTimeout(function () {
        var list = matched();
        var body = document.getElementById("ledger-body");
        if (body) body.innerHTML = ledgerBody(list);
        var sm = document.getElementById("ledger-sum");
        if (sm) sm.textContent = "筛出 " + list.length + " 笔";
        try { AppUI.decorate(); } catch (err) {}
      }, 120);
    }
  });

  host.addEventListener("change", function (e) {
    var id = e.target && e.target.id;
    if (id === "ledger-cat") { ledgerFilter.cat = e.target.value; AppUI.rerender(); }
    else if (id === "pref-theme") {
      var p = BF.prefs.read(); p.theme = e.target.value; BF.prefs.write(p); applyTheme();
      toast("主题已切换");
    } else if (id === "pref-accent") {
      var p2 = BF.prefs.read(); p2.accent = e.target.value; BF.prefs.write(p2); applyTheme();
      toast("强调色已切换");
    }
  });

  host.addEventListener("click", function (e) {
    var id = e.target && e.target.id;
    if (id === "pref-sync") { toast("正在同步…"); BF.pullCloud(true).then(refresh); }
    else if (id === "pref-clear") {
      try { localStorage.removeItem("class_fund_cache_v2"); localStorage.removeItem("class_fund_records"); } catch (err) {}
      toast("本机缓存已清除，正在重新拉取…");
      BF.pullCloud(true).then(refresh);
    }
  });

  /* ---------------- 对外：当前页重绘 ---------------- */
  window.__bfRefresh = function () {
    var cur = AppUI.page;
    if (PAGES[cur] && PAGES[cur].render) { PAGES[cur].render(); try { AppUI.decorate(); } catch (e) {} }
  };

  /* 数据回来后刷新当前页 */
  var origRender = null;
  window.__bfAfterBoot = function () {
    try { AppUI.go(AppUI.page); } catch (e) {}
  };
})();

</script>

<!-- ============ 班费公示 · 启动层 ============ -->
<script>
/* ==========================================================================
 * 班费公示 · 启动层
 *  1) 把框架的「账号文档」改成本机偏好（主题/强调色），
 *     框架的 applyTheme / applyScale 照常工作，但完全不需要注册账号。
 *  2) 关掉「必须先登录」的门槛：这是公开公示页，访客免登录直接看。
 *  3) 启动流程：初始化外壳 → 用本机缓存渲染 → 后台拉云端 → 回来刷新。
 *
 * 注意：这里刻意不重写函数声明（严格模式下给函数声明赋值会抛错）。
 * 主题/缩放偏好通过 AppAuth.data() 接入，框架原生读取，无需打补丁。
 * ========================================================================== */
(function () {
  "use strict";

  var BF = window.BF;
  var PREFS = "class_fund_prefs_v2";

  function readPrefs() {
    try { return JSON.parse(localStorage.getItem(PREFS) || "{}") || {}; } catch (e) { return {}; }
  }

  /* ---- 1. 本机偏好当账号文档 ---- */
  function fakeDoc() {
    var p = readPrefs();
    return {
      settings: {
        theme: p.theme || "auto",                                  /* auto | light | dark */
        accent: p.accent || "graphite",                            /* 7 套强调色之一 */
        uiScale: typeof p.uiScale === "number" ? p.uiScale : 100,
        autoScale: p.autoScale !== false,
        onboarded: true
      },
      profile: { nick: "", bio: "", email: "", avatar: "" },
      items: [],
      stats: { created: Date.now(), totalOps: 0, lastOpDay: "", dayLog: {} },
      meta: { updated: 0 },
      cloud: { enabled: false, lastSync: 0 }
    };
  }

  AppAuth.current = function () { return { user: "guest", guest: true }; };
  AppAuth.displayName = function () { return "访客"; };
  AppAuth.displayLabel = function () { return "访客"; };
  AppAuth.data = function () { return fakeDoc(); };
  AppAuth.save = function () {};
  AppAuth.profile = function () { return fakeDoc().profile; };
  AppAuth.saveProfile = function () {};
  AppAuth.logout = function () { toast("本页为公开公示页，无需登录"); };
  AppAuth.showAuth = function () { /* 公开页：不显示登录页 */ };

  /* ---- 2. 关掉「断网拦截层」 ----
     本页数据走 Supabase REST（不走框架的 sl_* RPC），Net 的探测与我们无关；
     断网时本机缓存照常可看，不该被全屏拦截层挡住。 */
  try {
    Net.onCloudFailure = function () {};
    Net.showGate = function () {};
    var gate = document.getElementById("net-gate");
    if (gate) gate.hidden = true;
  } catch (e) {}

  /* ---- 3. 启动 ---- */
  function start() {
    try {
      AppUI.init();
    } catch (e) {
      try { console.warn("[班费] 外壳初始化失败", e); } catch (_) {}
    }
    /* 数据层：先用本机缓存渲染（离线可看），再拉云端并在回来后刷新当前页 */
    try { BF.boot(); } catch (e) { console.warn("[班费] 数据层启动失败", e); }
    try { window.__bfRefresh(); } catch (e) {}

    var tick = 0;
    var timer = setInterval(function () {
      tick++;
      try { window.__bfRefresh(); } catch (e) {}
      if (tick >= 8) clearInterval(timer);
    }, 900);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

</script>

</script>
